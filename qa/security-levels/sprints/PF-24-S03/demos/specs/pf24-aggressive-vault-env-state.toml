# Aggressive active (stored before launch by wrappers/seed-aggressive.sh).
# Vault use is refused, secret-looking variables are gone, and the agent
# cannot rewrite the stored level.
id = "pf24-aggressive-vault-env-state"
feature = "Aggressive: vault, secrets and level file"
expected = "corbanu vault is refused by policy; the DEMO_VAULT_CANARY variable is absent (0 bytes) from agent commands; the approved attempt to rewrite security_level.toml is denied and the level stays aggressive."
model = "glm-5.2"
provider = "zai"
config = """
suppress_unstable_features_warning = true
[features]
security_levels = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[fixtures]
"agent-probe.sh" = """
printenv DEMO_VAULT_CANARY | wc -c | sed 's/^ */canary-bytes=/'
printf 'version = 1\\nlevel = "permissive"\\n' > ../home/security_level.toml && echo level-rewritten || echo level-write-denied
"""

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0

[[steps]]
type = "Run exactly this shell command, unchanged, without requesting escalated permissions and show its raw output: corbanu vault --help"
[[steps]]
key = "Enter"
[[steps]]
wait = "(?i)(rejected|forbidden|cannot use the Corbanu vault)"
timeout = 180
compress = 2
[[steps]]
pause = 2.5
[[steps]]
type = "Now run exactly this shell command without requesting escalated permissions and show its raw output: bash agent-probe.sh"
[[steps]]
key = "Enter"
[[steps]]
wait = "Would you like to run the following command\\?"
timeout = 180
compress = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "level-write-denied"
timeout = 180
compress = 2
[[steps]]
pause = 2.0
[[steps]]
type = "!cat ../home/security_level.toml"
[[steps]]
key = "Enter"
[[steps]]
wait = "level = \"aggressive\""
[[steps]]
pause = 3.0
