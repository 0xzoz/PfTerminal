# #626 follow-up (Travis, 2026-10-13): with zsh-fork on, the prompt for a program
# a command's script starts also says which remembered approval Aggressive
# suspended.
id = "issue626-zsh-fork-remembered-approval-note"
feature = "#626 follow-up: the suspended-approval note also appears for zsh-fork commands"
expected = "With zsh-fork on, the person approves `touch remembered.txt` with \"don't ask again\" under Permissive. Under Aggressive the model runs `f=remembered.txt; touch \"$f\"`; the script's `touch` is intercepted and its prompt says the remembered approval was not applied because Aggressive is on."
model = "glm-5.3-flash"
provider = "zai"
cols = 120
rows = 40
setup = "cp \"$(dotslash -- fetch {run}/../../../../codex-rs/app-server/tests/suite/zsh)\" {home}/fork-zsh"
setup_timeout = 300
config = """
suppress_unstable_features_warning = true
approval_policy = "untrusted"
zsh_path = "{home}/fork-zsh"

[features]
shell_zsh_fork = true
unified_exec_zsh_fork = true
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[fixtures]
"notes.txt" = "buy coffee\nreview budget\n"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0
[[steps]]
type = "Run exactly this shell command once, unchanged: touch remembered.txt"
[[steps]]
key = "Enter"
[[steps]]
wait = "don't ask again for commands that start with"
timeout = 180
compress = 2
[[steps]]
pause = 1.5
[[steps]]
key = "Down"
[[steps]]
key = "Enter"
[[steps]]
wait = "You approved Corbanu to always run commands that start with"
timeout = 60
[[steps]]
wait = "(?s)always run commands.*\\n• "
timeout = 120
compress = 2
[[steps]]
pause = 1.5
[[steps]]
run = "rm {workspace}/remembered.txt && grep -q 'touch' {home}/rules/default.rules"
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "enter confirm and save"
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
timeout = 60
[[steps]]
key = "r"
[[steps]]
wait = "Z.AI GLM 5.3 Flash via zai"
timeout = 60
compress = 2
[[steps]]
pause = 1.0
[[steps]]
type = "Run exactly this shell command once, unchanged: f=remembered.txt; touch \"$f\""
[[steps]]
key = "Enter"
[[steps]]
wait = "Would you like to run the following command"
timeout = 180
compress = 2
[[steps]]
pause = 1.5
[[steps]]
key = "Enter"
[[steps]]
wait = "(?s)/touch remembered\\.txt.*Reason: A remembered approval.*was not\\s+applied"
timeout = 120
compress = 2
[[steps]]
pause = 5.0
