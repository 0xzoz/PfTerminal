# Issue #554: a contained Claude pane explains an old Claude Code when it opens. Record with an old `claude`
# (< 2.1.292) first on PATH.
id = "issue554-old-claude-explained"
feature = "A contained Claude pane explains an old Claude Code as soon as it opens"
expected = "With Claude Code 2.1.92 on PATH, creating a Claude pane under Aggressive says it cannot run yet: which `claude`, its version, the 2.1.292 minimum and how to update."
model = "glm-5.3-flash"
provider = "zai"
config = """
suppress_unstable_features_warning = true
[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"
CLAUDE_CODE_OAUTH_TOKEN = "claude-plan-test-token"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0

[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Switch to Aggressive\\?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active now in this session"
[[steps]]
key = "Escape"

[[steps]]
type = "/panes"
[[steps]]
key = "Enter"
[[steps]]
wait = "Create User Pane"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Opus 5.5 Claude Plan"
[[steps]]
key = "Down"
repeat = 6
[[steps]]
key = "Enter"
[[steps]]
wait = "Name Claude pane"
[[steps]]
key = "Enter"
[[steps]]
wait = "This Claude pane cannot run yet"
timeout = 60
[[steps]]
pause = 5.0
