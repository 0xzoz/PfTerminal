# PF-84 #555 (c): a missing [provider_accounts] account does not block resume.
# Record with
#   DEMO_CANDIDATE=<corbanu> python3 scripts/demo_video.py record \
#     qa/demos/specs/pf84-555-provider-accounts-ghost.toml \
#     --bin qa/demos/wrappers/pf84-555-provider-accounts-ghost.sh --sprint ISSUE-555-RESUME --publish
id = "pf84-555-provider-accounts-ghost"
feature = "PF-84 #555: resume works when [provider_accounts] names a missing account"
expected = "[provider_accounts] zai = \"ghost\" does not exist. corbanu resume --last reopens the conversation recorded on work; it answers and /status shows account work."
model = "glm-5.3-flash"
provider = "zai"
rows = 44
config = """
suppress_unstable_features_warning = true
[features]
named_accounts = true
[provider_accounts]
zai = "ghost"
"""

[credentials]
PF84_ACCOUNT_SEED = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0
[[steps]]
type = "Reply with the single word ping"
[[steps]]
key = "Enter"
[[steps]]
wait = "(?m)^\\W*ping\\W*$"
timeout = 120
compress = 3
[[steps]]
run = "sleep 8"
[[steps]]
type = "/exit"
[[steps]]
key = "Enter"
[[steps]]
wait = "Now: corbanu resume --last"
[[steps]]
pause = 2.0
[[steps]]
wait = "Reply with the single word ping"
timeout = 60
[[steps]]
pause = 1.0
[[steps]]
type = "Reply with the single word pong"
[[steps]]
key = "Enter"
[[steps]]
wait = "(?m)^\\W*pong\\W*$"
timeout = 120
compress = 3
[[steps]]
run = "sleep 6"
[[steps]]
type = "/status"
[[steps]]
key = "Enter"
[[steps]]
wait = "Account usage:\\s+work"
[[steps]]
pause = 4.0
