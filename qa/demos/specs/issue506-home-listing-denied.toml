# Issue #506 (from #443, AGG-04): under Aggressive, agent commands cannot list the Corbanu home.
id = "issue506-home-listing-denied"
feature = "Under Aggressive, agent commands cannot list the Corbanu home, from the moment you confirm"
expected = "Without restarting, the agent's `ls -la \"$CORBANU_HOME\"` is denied (Operation not permitted) and explained where it happens: the level, never grantable, and how to change it."
model = "glm-5.3-flash"
provider = "zai"
config = """
suppress_unstable_features_warning = true
[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0

[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Switch to Aggressive\\?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active now in this session"
[[steps]]
pause = 2.0
[[steps]]
key = "Escape"

[[steps]]
type = "Run exactly this shell command once, unchanged, and show its output: ls -la \"$CORBANU_HOME\""
[[steps]]
key = "Enter"
[[steps]]
wait = "Security level Aggressive blocked listing"
timeout = 180
compress = 3
[[steps]]
wait = "(?m)^› "
timeout = 120
compress = 2
[[steps]]
pause = 3.5
