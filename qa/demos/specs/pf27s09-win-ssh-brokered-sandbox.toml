# PF-27-S09 (Windows over SSH): brokered model auth with the elevated sandbox, run from
# an SSH session (a non-interactive window station; #341/#343/#345).
id = "pf27s09-win-ssh-brokered-sandbox"
feature = "Windows model-client auth through the broker over SSH: the model answers through the broker's pipe and an agent command runs in the elevated sandbox"
expected = "The agent runs whoami as the sandbox user (codexsandbox...) and answers; Core's environment no longer holds ZAI_API_KEY; the log shows the broker (token+dacl+job) holds the Z.AI credential."
model = "glm-5.2"
provider = "zai"
cols = 120
rows = 36
config = """
approval_policy = "never"
sandbox_mode = "workspace-write"
suppress_unstable_features_warning = true

[windows]
sandbox = "elevated"

[features]
broker_model_auth = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Do you trust the contents of this directory"

[[steps]]
key = "Enter"

[[steps]]
wait = "Corbanu Terminal \\(v"

[[steps]]
pause = 1.0

[[steps]]
type = "Run this exact command once and show me its raw output, then stop: whoami"

[[steps]]
key = "Enter"

[[steps]]
wait = "(?i)codexsandbox"
timeout = 240
compress = 3

[[steps]]
wait = "\\A(?![\\s\\S]*esc to interrupt)"
timeout = 120
compress = 2

[[steps]]
type = '''!"ZAI_API_KEY in Core's environment: " + $(if ($env:ZAI_API_KEY) { 'SET' } else { 'none' }); (sls -Path ../logs/codex-tui.log -Pattern 'containment=\S+|removed from the environment: \w+|held by the credential broker \(host=[^,]+').Matches.Value | Sort-Object -Unique'''

[[steps]]
key = "Enter"

[[steps]]
wait = "removed from the environment: ZAI_API_KEY"
timeout = 60

[[steps]]
wait = "environment: none"
timeout = 10

[[steps]]
wait = "held by the credential broker \\(host=api\\.z\\.ai"
timeout = 10

[[steps]]
pause = 4.0
