# PF-28-S02: injected credentials are bound to HTTPS, method and path. Same setup as
# pf28s02-reflected-credential (GH_HOST=httpbin.org, synthetic GH_ENTERPRISE_TOKEN).
id = "pf28s02-credential-path-bound"
feature = "Credential binding: the broker sends a credential only to paths its provider uses"
expected = "A git smart-HTTP path on the bound host gets the credential (200). Any other path on the same host is refused with 403 before the credential is sent."
model = "glm-5.2"
provider = "zai"
cols = 120
rows = 36
config = """
approval_policy = "never"
sandbox_mode = "workspace-write"
suppress_unstable_features_warning = true

[sandbox_workspace_write]
network_access = true

[features]
isolated_credential_broker = true
secret_output_gate = true

[features.network_proxy]
enabled = true

[features.network_proxy.domains]
"httpbin.org" = "allow"
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[fixtures]
"paths.sh" = '''
for path in /anything/o/r.git/info/refs /anything/settings/tokens /anything/o/%2e%2e/x/info/refs; do
  code=$(curl -sS -o /dev/null -w '%{http_code}' "https://httpbin.org$path" \
    -H "Authorization: Bearer $GH_ENTERPRISE_TOKEN")
  echo "GET $path -> $code"
done
'''

[[steps]]
wait = "Corbanu Terminal \\(v"

[[steps]]
pause = 1.0

[[steps]]
type = "Run sh paths.sh once and show me its three output lines exactly, then stop."

[[steps]]
key = "Enter"

[[steps]]
wait = "x/info/refs -> \\d+[\\s\\S]*x/info/refs -> \\d+"
timeout = 240
compress = 3

[[steps]]
pause = 4.0
