# PF-29-S01. Record with
#   PF29_CANDIDATE=<corbanu> --bin qa/security-levels/sprints/PF-29-S01/demos/restart-once.sh
id = "pf29s01-resume-refused"
feature = "Conversations recorded before activation cannot be resumed"
expected = "After a chat, Aggressive is saved with a passing preflight and Corbanu restarts; /resume of the earlier conversation is refused because it may hold secrets from before the boundary existed."
model = "glm-5.2"
provider = "zai"
config = """
suppress_unstable_features_warning = true
[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"


[[steps]]
wait = "Corbanu Terminal \\(v"

[[steps]]
type = "Reply with exactly: hello from before"

[[steps]]
key = "Enter"

[[steps]]
wait = "hello from before[\\s\\S]*hello from before"
timeout = 120
compress = 3

[[steps]]
type = "/security"

[[steps]]
key = "Enter"

[[steps]]
wait = "Active in this session: Permissive"

[[steps]]
key = "Up"

[[steps]]
key = "Enter"

[[steps]]
wait = "Switch to Aggressive\\?"

[[steps]]
key = "Down"
repeat = 20

[[steps]]
wait = "Preflight passed"

[[steps]]
pause = 2.0

[[steps]]
key = "Enter"

[[steps]]
wait = "Saved: Aggressive"

[[steps]]
pause = 1.0

[[steps]]
key = "Enter"

[[steps]]
type = "/exit"

[[steps]]
key = "Enter"

[[steps]]
wait = "restarting Corbanu Terminal.*model: +glm-5\\.2"
timeout = 60

[[steps]]
pause = 1.0

[[steps]]
type = "/resume"

[[steps]]
key = "Enter"

[[steps]]
wait = "Resume a previous session"

[[steps]]
pause = 1.5

[[steps]]
key = "Enter"

[[steps]]
wait = "recorded before protected mode was activated"

[[steps]]
pause = 4.0
