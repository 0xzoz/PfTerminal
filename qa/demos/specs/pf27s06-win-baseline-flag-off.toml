# PF-27-S06 Windows gate, positive control: the same probe with secretless_agent_launch off.
id = "pf27s06-win-baseline-flag-off"
feature = "Control: Windows elevated sandbox with secretless_agent_launch off; the same agent probe of Corbanu's files"
expected = "Without the contract the sandbox user reads the vault store, sign-in file, config and state database, and can write config.toml."
model = "glm-5.2"
provider = "zai"
cols = 120
rows = 36
config = """
approval_policy = "never"
sandbox_mode = "workspace-write"
suppress_unstable_features_warning = true

[windows]
sandbox = "elevated"

[sandbox_workspace_write]
network_access = true

[features]
isolated_credential_broker = false
secretless_agent_launch = false

[features.network_proxy]
enabled = true
allow_local_binding = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[fixtures]
"probe.ps1" = '''
# Tries to read Corbanu's protected files from an agent command.
$h = $env:CODEX_HOME
$results = [ordered]@{}
function probe($key, $label, $path) {
  try { $f = [IO.File]::Open($path, 'Open', 'Read', 'ReadWrite, Delete'); [void]$f.ReadByte(); $f.Dispose(); $r = 'READ' }
  catch [UnauthorizedAccessException] { $r = 'denied' }
  catch [IO.FileNotFoundException] { $r = 'missing' }
  catch { $r = 'error: ' + $_.Exception.InnerException.Message }
  $script:results[$key] = $r
  "${label}: $r"
}
"running as $([Security.Principal.WindowsIdentity]::GetCurrent().Name)"
probe 'vault' 'vault store  secrets\local.age' "$h\secrets\local.age"
probe 'auth.json' 'sign-in      auth.json' "$h\auth.json"
probe 'config' 'config       config.toml' "$h\config.toml"
$db = Get-ChildItem $h -Filter '*state*.sqlite' | Select-Object -First 1
probe 'state-db' "state db     $($db.Name)" $db.FullName
try { [IO.File]::AppendAllText("$h\config.toml", ' '); $w = 'WRITTEN' } catch { $w = 'denied' }
$results['config-write'] = $w
"write        config.toml: $w"
probe 'control' 'control      workspace probe.ps1' "$PWD\probe.ps1"
'summary: ' + (($results.GetEnumerator() | ForEach-Object { "$($_.Key) $($_.Value)" }) -join ' | ')
'probes done'
'''

[[steps]]
wait = "Do you trust the contents of this directory"

[[steps]]
key = "Enter"

[[steps]]
wait = "Corbanu Terminal \\(v"

[[steps]]
type = "!New-Item -ItemType Directory -Force $env:CODEX_HOME/secrets | Out-Null; 'synthetic-vault' > $env:CODEX_HOME/secrets/local.age; '{}' > $env:CODEX_HOME/auth.json; 'seeded'"

[[steps]]
key = "Enter"

[[steps]]
wait = "(?m)^\\s*└ seeded"

[[steps]]
type = "Run this exact command once and show me its raw output, then stop: powershell -NoProfile -ExecutionPolicy Bypass -File probe.ps1"

[[steps]]
key = "Enter"

[[steps]]
wait = "probes done"
timeout = 240
compress = 3

[[steps]]
wait = "summary: vault"
timeout = 60

[[steps]]
pause = 6.0
