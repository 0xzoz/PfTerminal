# Issue #443 follow-up (milestone AGG-04): a command the sandbox stops as it starts is shown on screen.
id = "issue443-denied-command-shown"
feature = "A command the sandbox stops as it starts is shown, like any command that ran"
expected = "With Aggressive confirmed, the agent reads the Corbanu home config; the screen shows the command it ran and the sandbox denial (Operation not permitted), not only the model's summary."
model = "glm-5.3-flash"
provider = "zai"
config = """
suppress_unstable_features_warning = true
[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Switch to Aggressive\\?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
[[steps]]
pause = 1.0
[[steps]]
key = "Escape"

[[steps]]
type = "Without reading anything first, run exactly this shell command once, unchanged: head -3 \"$CORBANU_HOME/config.toml\""
[[steps]]
key = "Enter"
[[steps]]
wait = "Ran head -3"
timeout = 180
compress = 3
[[steps]]
wait = "(?m)^› "
timeout = 120
compress = 2
[[steps]]
pause = 3.5
