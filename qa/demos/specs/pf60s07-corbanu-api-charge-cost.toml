# PF-60-S07 (Travis, 2026-10-14): Corbanu API requests are priced from the charge the Corbanu API reports with each
# response (usage.corbanu_charge_usd), by the same rule as OpenRouter's (#784). One real Corbanu API turn, then /cost:
# the first screen and the request page say "charged by Corbanu API", the request page names its price basis, and the
# attempt page keeps the published-price estimate only as an unused audit line.
id = "pf60s07-corbanu-api-charge-cost"
feature = "/cost prices a Corbanu API request from the charge the Corbanu API reported (#368)"
expected = "After a real Corbanu API turn, /cost reads 'Cost: $…, charged by Corbanu API'; the request page names its price basis (usage.corbanu_charge_usd); the attempt page shows the published-price estimate as not used."
model = "corbanu/deepseek-v4.1-flash"
provider = "pfterminal-plan"
rows = 46
cols = 150
config = """
suppress_unstable_features_warning = true
"""

[credentials]
PFTERMINAL_PLAN_API_KEY = "provider/pfterminal_plan_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
type = "Reply with the single word OK."
[[steps]]
key = "Enter"
[[steps]]
wait = "(?m)^\\W*OK\\W*$"
timeout = 180
compress = 3
[[steps]]
type = "/cost"
[[steps]]
key = "Enter"
[[steps]]
wait = "Cost: \\$[0-9.]+(?: \\(rounded\\))?, charged by Corbanu API"
[[steps]]
pause = 4
[[steps]]
key = "Up"
repeat = 7
[[steps]]
wait = "› → Request 1"
[[steps]]
pause = 1
[[steps]]
key = "Enter"
[[steps]]
wait = "Price basis: the charge Corbanu API reported"
[[steps]]
pause = 4
[[steps]]
key = "Up"
repeat = 4
[[steps]]
wait = "› → Technical details"
[[steps]]
pause = 1
[[steps]]
key = "Enter"
[[steps]]
wait = "Attempt, components and original price"
[[steps]]
key = "Down"
repeat = 36
[[steps]]
wait = "Published-price estimate \\(not used"
[[steps]]
pause = 4
