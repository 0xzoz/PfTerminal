# PF-27-S02 secretless agent launch. Needs the synthetic GitHub Enterprise fixture
# (see qa/security-levels/sprints/PF-27-S02/README.md): GH_HOST and SSL_CERT_FILE exported,
# GH_ENTERPRISE_TOKEN and PF27_CANARY_API_KEY passed with --credential ...=file:...
id = "pf27s02-secretless-env"
feature = "Secretless agent launch: agent commands get no raw secrets, and the broker still works"
expected = "Core holds ZAI_API_KEY, PF27_CANARY_API_KEY and the GitHub token. The agent's only credential-looking variable is GH_ENTERPRISE_TOKEN, a dummy (sha is not 946ae98e9fbe), yet the server reports authorized: true."
model = "glm-5.2"
provider = "zai"
cols = 120
rows = 36
config = """
approval_policy = "never"
sandbox_mode = "workspace-write"
suppress_unstable_features_warning = true

[sandbox_workspace_write]
network_access = true

[features]
isolated_credential_broker = true
secretless_agent_launch = true

[features.network_proxy]
enabled = true
allow_local_binding = true

[features.network_proxy.domains]
"127.0.0.1.nip.io" = "allow"
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[fixtures]
"check.sh" = '''
printf 'credential-looking names: %s\n' "$(env | cut -d= -f1 | grep -iE 'key|token|secret|pass|auth' | sort | tr '\n' ' ')"
printf 'agent token sha256: %s\n' "$(printf %s "$GH_ENTERPRISE_TOKEN" | shasum -a 256 | cut -c1-12)"
curl -sS https://127.0.0.1.nip.io:8443/api/v3/user -H "Authorization: Bearer $GH_ENTERPRISE_TOKEN"
echo
'''

[[steps]]
wait = "Corbanu Terminal \\(v"

[[steps]]
pause = 1.0

[[steps]]
type = "Run sh check.sh once and show me its raw output, then stop."

[[steps]]
key = "Enter"

[[steps]]
wait = "\"authorized\": true"
timeout = 180
compress = 3

[[steps]]
pause = 4.0
