# Issue #507 (from #445, AGG-22): the kill switch stops Claude panes too.
id = "issue507-kill-switch-stops-claude-pane"
feature = "The kill switch stops a Claude pane's reply and refuses its next turn"
expected = "A Claude pane is writing a long reply; turning the kill switch on stops it with a message saying why, and the next Claude turn is refused before anything is sent."
model = "glm-5.3-flash"
provider = "zai"
config = """
suppress_unstable_features_warning = true
[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"
CLAUDE_CODE_OAUTH_TOKEN = "claude-plan-test-token"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0

[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Switch to Aggressive\\?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active now in this session"
[[steps]]
key = "Escape"

[[steps]]
type = "/panes"
[[steps]]
key = "Enter"
[[steps]]
wait = "Create User Pane"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Opus 5.5 Claude Plan"
[[steps]]
key = "Down"
repeat = 6
[[steps]]
key = "Enter"
[[steps]]
wait = "Name Claude pane"
[[steps]]
key = "Enter"
[[steps]]
pause = 2.0

[[steps]]
type = "Write a detailed 1500-word essay on the history of tea, in plain text."
[[steps]]
key = "Enter"
[[steps]]
wait = "esc to interrupt|Claude"
timeout = 60
[[steps]]
pause = 12.0

[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Security level"
[[steps]]
key = "g"
[[steps]]
wait = "Grants and kill switch"
[[steps]]
key = "Down"
[[steps]]
key = "Enter"
[[steps]]
wait = "Turn the kill switch on\\?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Kill switch on"
[[steps]]
key = "Escape"
repeat = 2
[[steps]]
wait = "security kill switch was turned on"
timeout = 60
[[steps]]
pause = 2.0

[[steps]]
type = "Reply with exactly the word pong and nothing else."
[[steps]]
key = "Enter"
[[steps]]
wait = "Not sent: the security kill switch is on"
timeout = 60
[[steps]]
pause = 3.5
