# Moderate reel: the kill switch works under Moderate: on, a turn is refused; off again.
id = "modreel-kill-switch"
feature = "The kill switch under Moderate"
expected = "Under Moderate, /security, g, turns the kill switch on: a new message is not sent while it is on. Turning it off from the same screen lets work continue."
model = "glm-5.3-flash"
provider = "zai"
config = """
approval_policy = "on-request"
suppress_unstable_features_warning = true

[security]
version = 1
level = "moderate"

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
wait = "model:\\s+glm-5\\.3-flash"
[[steps]]
pause = 1.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Moderate"
[[steps]]
pause = 1.0
[[steps]]
key = "g"
[[steps]]
wait = "Grants and kill switch"
[[steps]]
pause = 2.0
[[steps]]
key = "Down"
[[steps]]
key = "Enter"
[[steps]]
wait = "Turn the kill switch on\\?"
[[steps]]
pause = 3.0
[[steps]]
key = "Enter"
[[steps]]
wait = "Kill switch on"
[[steps]]
pause = 2.5
[[steps]]
key = "Escape"
repeat = 3
[[steps]]
wait = "(?m)^› "
[[steps]]
type = "What is 2+2?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Not sent: the security kill switch is on"
timeout = 60
[[steps]]
pause = 4.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Security level"
[[steps]]
key = "g"
[[steps]]
wait = "Grants and kill switch"
[[steps]]
key = "Down"
[[steps]]
key = "Enter"
[[steps]]
wait = "Turn the kill switch off\\?"
[[steps]]
pause = 2.0
[[steps]]
key = "Down"
[[steps]]
key = "Enter"
[[steps]]
wait = "Kill switch off"
[[steps]]
pause = 3.0
