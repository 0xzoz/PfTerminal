# PF-27-S09 (Windows, normal session): a Z.AI key stored in the encrypted vault is
# decrypted inside the broker, under its own token. Run with
# --bin <shim for qa/security-levels/sprints/PF-27-S05/vault-seed-launch.sh> and
# PF27_CANDIDATE=<corbanu.exe>: the key is in neither Core's environment nor its arguments.
id = "pf27s09-win-vault-key-brokered"
feature = "Windows model-client auth through the broker (normal session): a Z.AI key stored in the vault is read inside the broker; Core never decrypts it"
expected = "The session answers. Core's environment has no ZAI_API_KEY; the vault holds the key; the log shows the broker holds the Z.AI credential (and no 'removed from the environment' line: nothing was handed over)."
model = "glm-5.2"
provider = "zai"
cols = 120
rows = 36
config = """
approval_policy = "never"
sandbox_mode = "read-only"
suppress_unstable_features_warning = true

[windows]
sandbox = "unelevated"

[features]
broker_model_auth = true
"""

[credentials]
PF27_VAULT_SEED = "provider/zai_api_key"

[[steps]]
wait = "Do you trust the contents of this directory"

[[steps]]
key = "Enter"

[[steps]]
wait = "Corbanu Terminal \\(v"

[[steps]]
pause = 1.0

[[steps]]
type = '''!"ZAI_API_KEY in Core's environment: " + $(if ($env:ZAI_API_KEY) { 'SET' } else { 'none' }); (ls ../home/secrets).Name'''

[[steps]]
key = "Enter"

[[steps]]
wait = "local.age"
timeout = 30

[[steps]]
wait = "environment: none"
timeout = 10

[[steps]]
type = "Reply with exactly one line: hello from the vault-backed session"

[[steps]]
key = "Enter"

[[steps]]
wait = "(?m)^. hello from the vault-backed session"
timeout = 240
compress = 3

[[steps]]
wait = "\\A(?![\\s\\S]*esc to interrupt)"
timeout = 120
compress = 1

[[steps]]
type = '''!(sls -Path ../logs/codex-tui.log -Pattern 'containment=\S+|removed from the environment: \w+|held by the credential broker \(host=[^,]+, port=\d+, path=[^,]+, header=\w+').Matches.Value | Sort-Object -Unique'''

[[steps]]
key = "Enter"

[[steps]]
wait = "header=Bearer"
timeout = 60

[[steps]]
pause = 4.0
