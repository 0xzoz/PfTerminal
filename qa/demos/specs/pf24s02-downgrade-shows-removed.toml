# PF-24-S02: returning to Permissive shows the protections that go first; Esc changes nothing; confirming keeps this session Aggressive until restart. Mock model, no model turn (Z.AI balance was empty when recorded).
id = "pf24s02-downgrade-shows-removed"
feature = "Downgrade shows removed protections first"
expected = "Under Aggressive, choosing Permissive lists every protection removed at the next start; Esc leaves both records as they were; Enter saves Permissive and Core's level stays Aggressive in this session, Permissive from the next start."
model = "mock-model"
provider = "mock"
config = """
suppress_unstable_features_warning = true

[model_providers.mock]
name = "mock"
base_url = "http://127.0.0.1:9/v1"
env_key = "MOCK_KEY"
wire_api = "responses"

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
"""

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Up"
[[steps]]
key = "Enter"
[[steps]]
wait = "Preflight passed"
[[steps]]
key = "Enter"
[[steps]]
wait = "r restart now"
[[steps]]
key = "r"
[[steps]]
wait = "Restarting Corbanu Terminal[\\s\\S]*Corbanu Terminal \\(v[\\s\\S]*› "
timeout = 60
[[steps]]
pause = 1.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Aggressive"
[[steps]]
key = "Down"
[[steps]]
key = "Enter"
[[steps]]
wait = "Protections removed at the next start"
[[steps]]
pause = 4.0
[[steps]]
key = "Escape"
[[steps]]
wait = "Cancelled\\. Nothing changed\\."
[[steps]]
pause = 1.5
[[steps]]
key = "Enter"
[[steps]]
wait = "Return to Permissive\\?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Core.s level stays Aggressive in this session[\\s\\S]*is Permissive from the next start"
[[steps]]
pause = 4.0
