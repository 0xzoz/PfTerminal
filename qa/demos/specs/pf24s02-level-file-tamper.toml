# PF-24-S02: a level file rewritten to Permissive outside /security, while Core's confirmed level is Aggressive, is caught and Aggressive stays enforced. Mock model, no model turn (Z.AI balance was empty when recorded).
id = "pf24s02-level-file-tamper"
feature = "Level file changed outside /security is caught"
expected = "After Aggressive is confirmed, security_level.toml is overwritten with Permissive by a shell command; /security reports the stored level as changed outside /security and says Aggressive is enforced."
model = "mock-model"
provider = "mock"
config = """
suppress_unstable_features_warning = true

[model_providers.mock]
name = "mock"
base_url = "http://127.0.0.1:9/v1"
env_key = "MOCK_KEY"
wire_api = "responses"

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
"""

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
key = "Up"
[[steps]]
key = "Enter"
[[steps]]
wait = "Preflight passed"
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
[[steps]]
key = "Escape"
[[steps]]
pause = 1.0
[[steps]]
type = "!printf 'version = 1\\nlevel = \"permissive\"\\n' > {home}/security_level.toml && echo rewritten"
[[steps]]
key = "Enter"
[[steps]]
wait = "rewritten"
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "changed outside /security"
[[steps]]
pause = 4.0
