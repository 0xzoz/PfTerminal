# PF-30-S01: labelling external context does not break ordinary multi-step tool use.
id = "pf30-normal-tool-use"
feature = "Ordinary tool use still works with labelled context (source_envelopes, Moderate)"
expected = "GLM edits a file and reads it back across several tool calls; every tool output it sees is labelled data, and the task completes normally."
model = "glm-5.2"
provider = "zai"
config = """
approval_policy = "never"

[security]
version = 1
level = "moderate"

[features]
source_envelopes = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[fixtures]
"greet.py" = """print("hello")
"""

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0

[[steps]]
type = "Change greet.py so it prints hello, world, then run python3 greet.py and reply with its output."
[[steps]]
key = "Enter"
[[steps]]
wait = "Ran python3 greet\\.py"
timeout = 240
compress = 3
[[steps]]
wait = "(?m)^• (?!Ran|Edited|Explored).*hello, world"
timeout = 120
compress = 2
[[steps]]
pause = 4.0
