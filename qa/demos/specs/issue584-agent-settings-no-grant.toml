# Issue #584: under Aggressive, a command that writes only .codex/.agents gets no Grant once.
id = "issue584-agent-settings-no-grant"
feature = "#584: no Grant once for a .codex/.agents write no grant lifts"
expected = "Under Aggressive, the approval for `printf x > .codex/notes.toml` offers no Grant once and says why (the project's .codex and .agents stay read-only, not even once); approved, the write is denied and explained the same way."
model = "glm-5.3-flash"
provider = "zai"
rows = 64
setup = "mkdir -p .codex .agents"
config = """
suppress_unstable_features_warning = true

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Preflight passed"
[[steps]]
pause = 1.5
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
timeout = 60
[[steps]]
pause = 1.0
[[steps]]
key = "r"
[[steps]]
wait = "Z.AI GLM 5.3 Flash via zai"
timeout = 60
compress = 2
[[steps]]
pause = 1.0
[[steps]]
type = "Run exactly this shell command once, unchanged: printf x > .codex/notes.toml"
[[steps]]
key = "Enter"
[[steps]]
wait = "Press enter to confirm"
timeout = 180
compress = 2
[[steps]]
wait = "blocks writing"
[[steps]]
pause = 4.0
[[steps]]
key = "y"
[[steps]]
key = "Enter"
[[steps]]
wait = "Security level Aggressive blocks writing"
timeout = 60
compress = 2
[[steps]]
wait = "(?s)Security level Aggressive block.*─{10}.*\\n• "
timeout = 120
compress = 2
[[steps]]
pause = 3.5
