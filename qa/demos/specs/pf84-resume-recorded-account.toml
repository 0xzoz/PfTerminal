# PF-84 #545: `corbanu resume` without --account resumes on the named account the
# conversation ran on, even when the home has no default key for the provider.
# Record with
#   DEMO_CANDIDATE=<corbanu> python3 scripts/demo_video.py record \
#     qa/demos/specs/pf84-resume-recorded-account.toml \
#     --bin qa/demos/wrappers/pf84-resume-recorded-account.sh --sprint ISSUE-545 --publish
id = "pf84-resume-recorded-account"
feature = "PF-84 #545: corbanu resume uses the conversation's named account, not the API-key screen"
expected = "After a session on account work, `corbanu resume --last` (no --account, no default key) reopens it and /status shows account work."
model = "glm-5.3-flash"
provider = "zai"
rows = 40
config = """
suppress_unstable_features_warning = true
[features]
named_accounts = true
"""

[credentials]
PF84_ACCOUNT_SEED = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0
[[steps]]
type = "Reply with the single word pong"
[[steps]]
key = "Enter"
[[steps]]
wait = "(?m)^\\W*pong\\W*$"
timeout = 120
compress = 3
[[steps]]
run = "sleep 8"
[[steps]]
type = "/exit"
[[steps]]
key = "Enter"
[[steps]]
wait = "Now: corbanu resume --last"
[[steps]]
pause = 2.0
[[steps]]
wait = "Reply with the single word pong"
timeout = 60
[[steps]]
pause = 1.5
[[steps]]
type = "/status"
[[steps]]
key = "Enter"
[[steps]]
wait = "account work"
[[steps]]
pause = 4.0
