# Issue #445 (milestone AGG-22): with the kill switch on, model turns are refused, not sent.
id = "issue445-kill-switch-refuses-turns"
feature = "With the kill switch on, model turns are refused and nothing is sent"
expected = "After turning the kill switch on in /security, a question is refused with a message naming the kill switch and how to turn it off; after turning it off, the next question is answered."
model = "glm-5.3-flash"
provider = "zai"
config = """
suppress_unstable_features_warning = true
[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Switch to Aggressive\\?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
[[steps]]
key = "Escape"

[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Security level"
[[steps]]
key = "g"
[[steps]]
wait = "Grants and kill switch"
[[steps]]
key = "Down"
[[steps]]
key = "Enter"
[[steps]]
wait = "Turn the kill switch on\\?"
[[steps]]
pause = 3.0
[[steps]]
key = "Enter"
[[steps]]
wait = "Kill switch on"
[[steps]]
key = "Escape"
repeat = 3
[[steps]]
wait = "(?m)^› "

[[steps]]
type = "What is 2+2?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Not sent: the security kill switch is on"
timeout = 60
[[steps]]
pause = 4.0

[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Security level"
[[steps]]
key = "g"
[[steps]]
wait = "Grants and kill switch"
[[steps]]
key = "Down"
[[steps]]
key = "Enter"
[[steps]]
wait = "Turn the kill switch off\\?"
[[steps]]
key = "Down"
[[steps]]
key = "Enter"
[[steps]]
wait = "Kill switch off"
[[steps]]
key = "Escape"
repeat = 3
[[steps]]
wait = "(?m)^› "

[[steps]]
type = "What is 3+3?"
[[steps]]
key = "Enter"
[[steps]]
wait = "(?s)What is 3\\+3\\?.*\\n• [^\\n]*6"
timeout = 180
compress = 3
[[steps]]
pause = 3.0
