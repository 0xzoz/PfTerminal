# Issue #554 (from #521): listing the folder above the Corbanu home recursively is explained like a direct listing.
id = "issue554-find-above-home-explained"
feature = "Under Aggressive, a search of the folder above the Corbanu home is denied and explained"
expected = "The agent's `find` of the folder holding the Corbanu home cannot list the home (Operation not permitted), and the denial is explained where it happens, as for `ls` of the home."
model = "glm-5.3-flash"
provider = "zai"
config = """
suppress_unstable_features_warning = true
[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0

[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Switch to Aggressive\\?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active now in this session"
[[steps]]
pause = 1.5
[[steps]]
key = "Escape"

[[steps]]
type = "Run exactly this shell command once, unchanged, and show its output: find {run} -maxdepth 2 -name config.toml"
[[steps]]
key = "Enter"
[[steps]]
wait = "Security level Aggressive blocked listing"
timeout = 180
compress = 3
[[steps]]
wait = "(?m)^› "
timeout = 120
compress = 2
[[steps]]
pause = 3.5
