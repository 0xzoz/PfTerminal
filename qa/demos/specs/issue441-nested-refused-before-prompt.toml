# #441 (milestone AGG-19): under Aggressive with nested agents set to refuse,
# an agent's `corbanu exec` is refused before any approval prompt, with the
# reason. Record with DEMO_CANDIDATE=<corbanu> and
# --bin qa/demos/wrappers/candidate-on-path.sh so `corbanu` is the candidate.
id = "issue441-nested-refused-before-prompt"
feature = "#441: nested corbanu exec is refused before the approval prompt"
expected = "With Aggressive active (nested agents: refuse), the agent's `corbanu exec \"say hi\"` is refused at once with the nested-launch reason; no approval prompt appears and no second agent runs."
model = "glm-5.3-flash"
provider = "zai"
cols = 120
rows = 36
config = """
suppress_unstable_features_warning = true

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"



[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Up"
[[steps]]
key = "Enter"
[[steps]]
wait = "Nested agents: refuse"
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
[[steps]]
pause = 1.0
[[steps]]
key = "r"
[[steps]]
wait = "Corbanu Terminal \\(v"
timeout = 60
[[steps]]
pause = 2.0

[[steps]]
type = "Run exactly this shell command once, without changing it: corbanu exec \"say hi\" . If it is refused, quote the refusal reason in one sentence."
[[steps]]
key = "Enter"
[[steps]]
wait = "(?s)(nested agent launches are set to refuse|Would you like to run).*"
timeout = 240
compress = 3
[[steps]]
wait = "(?m)^› "
timeout = 240
compress = 2
[[steps]]
pause = 4.0
