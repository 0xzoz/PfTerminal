# Issue #789 (AGG-R14, replays Q11/Q11b): a child agent's prompt offers no Grant once where it cannot apply.
id = "issue789-child-no-useless-grant"
feature = "#789: no Grant once on a child agent's prompt where it cannot apply"
expected = "Under Aggressive a child agent asks to run sleep 60; echo finished > ks-child.txt. Its prompt offers no Grant once and says why."
model = "glm-5.3-flash"
provider = "zai"
cols = 140
rows = 50
config = """
suppress_unstable_features_warning = true

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 8.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Preflight passed"
[[steps]]
pause = 1.5
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
timeout = 60
[[steps]]
pause = 1.0
[[steps]]
key = "r"
[[steps]]
wait = "Z.AI GLM 5.3 Flash via zai"
timeout = 60
compress = 2
[[steps]]
pause = 1.0
[[steps]]
type = "Spawn a child agent and have it run exactly this command: sleep 60; echo finished > ks-child.txt"
[[steps]]
key = "Enter"
[[steps]]
wait = "(?s)Thread: Agent.*Press enter to confirm"
timeout = 240
compress = 2
[[steps]]
wait = "Grant once is not offered for this command"
[[steps]]
pause = 4.0
[[steps]]
run = "tmux -L \"$(ls -t \"${TMUX_TMPDIR:-/tmp}/tmux-$(id -u)\" | grep '^demo-issue789-child-no-useless-grant-' | head -1)\" capture-pane -p -t demo > {run}/prompt-789-child.txt"
