# #442 (Travis's decision 2026-10-12): "Grant once" under Aggressive says exactly what it lifts; .git,
# .codex and .agents stay read-only.
id = "issue442-grant-once-what-it-lifts"
feature = "#442: Grant once says exactly what it lifts under Aggressive"
expected = "A write command asks for approval; the Grant once option and its review say it only lets the command write git hooks kept outside .git and start-up files in the current folder, while .git, .codex and .agents stay read-only."
model = "glm-5.3-flash"
provider = "zai"
cols = 120
rows = 40
config = """
suppress_unstable_features_warning = true

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[fixtures]
"notes.txt" = "buy coffee\n"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Up"
[[steps]]
key = "Enter"
[[steps]]
wait = "Switch to Aggressive\\?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
[[steps]]
pause = 1.0

[[steps]]
key = "r"
[[steps]]
wait = "Corbanu Terminal \\(v"
timeout = 60
[[steps]]
pause = 2.0

[[steps]]
type = "Run exactly this shell command once, unchanged: printf x > note.txt; echo note=$?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Grant once"
timeout = 240
compress = 2
[[steps]]
pause = 2.5
[[steps]]
key = "g"
[[steps]]
key = "Enter"
[[steps]]
wait = "Grant this command\\?"
[[steps]]
pause = 6.0
