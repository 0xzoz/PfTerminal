# #444 (AGG-37, (y) label): Aggressive polish.
id = "agg-444-banner-hint"
feature = "#444: no stale restart banner; the approval key hint"
expected = "After restart now the Restarting line is gone; the approval prompt says a letter in brackets only highlights its option and Enter confirms it; y then Enter approves."
model = "glm-5.3-flash"
provider = "zai"
config = """
suppress_unstable_features_warning = true

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Preflight passed"
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
[[steps]]
pause = 1.0
[[steps]]
key = "r"
[[steps]]
wait = "Z.AI GLM 5.3 Flash via zai"
timeout = 60
compress = 2
[[steps]]
pause = 1.0
[[steps]]
type = "Run exactly this shell command and nothing else: touch demo-note.txt"
[[steps]]
key = "Enter"
[[steps]]
wait = "A letter in brackets only highlights its option"
timeout = 180
compress = 2
[[steps]]
pause = 3.0
[[steps]]
key = "y"
[[steps]]
key = "Enter"
[[steps]]
wait = "You approved Corbanu to run touch demo-note.txt"
timeout = 180
compress = 2
[[steps]]
pause = 3.0
