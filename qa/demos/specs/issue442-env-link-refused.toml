# #442 (Travis's decision 2026-10-12): a .env that is a link is still refused, and the refusal names the
# link, where it points and exactly how to fix it.
id = "issue442-env-link-refused"
feature = "#442: a .env that is a link is refused, with how to fix it"
expected = "The workspace's .env is a link to notes.txt. Switching to Aggressive and restarting is refused; the message names the link and its target and says to replace the link with a regular file or move it out of the workspace."
model = "glm-5.3-flash"
provider = "zai"
cols = 160
rows = 44
config = """
suppress_unstable_features_warning = true

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[fixtures]
"notes.txt" = "buy coffee\n"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Up"
[[steps]]
key = "Enter"
[[steps]]
wait = "Switch to Aggressive\\?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
[[steps]]
pause = 1.0

[[steps]]
run = "ln -s notes.txt {workspace}/.env"
[[steps]]
key = "r"
[[steps]]
wait = "Fix the setting, or choose Permissive"
timeout = 60
[[steps]]
pause = 5.0
