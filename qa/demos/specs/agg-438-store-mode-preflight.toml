# #438 (AGG-25): -c cli_auth_credentials_store="file" chooses where sign-in is stored; it is not a secret.
id = "agg-438-store-mode-preflight"
feature = "#438: a credential store mode does not block Aggressive"
expected = "Started with -c cli_auth_credentials_store=\"file\", the Aggressive review shows Preflight passed (on 0.1.48 it was blocked as an unmanaged secret) and Enter saves Aggressive."
model = "glm-5.3-flash"
provider = "zai"
args = ["-c", "cli_auth_credentials_store=\"file\""]
config = """
suppress_unstable_features_warning = true

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Preflight passed"
[[steps]]
pause = 3.0
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
[[steps]]
pause = 3.0
