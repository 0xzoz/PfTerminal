# Moderate reel: credential files and Corbanu's own files are protected; for Corbanu's files the prompt says approving cannot unlock them.
id = "modreel-protected-files"
feature = "Protected files under Moderate: credential files and Corbanu's own files"
expected = "Under Moderate, reading ~/.ssh/config is refused with a warning naming the level. Reading a file in Corbanu's vault folder asks first and says approving cannot unlock it; approved, the read still fails."
model = "glm-5.3-flash"
provider = "zai"
config = """
approval_policy = "on-request"
suppress_unstable_features_warning = true

[security]
version = 1
level = "moderate"

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
wait = "model:\\s+glm-5\\.3-flash"
[[steps]]
pause = 1.0
[[steps]]
run = "mkdir -p \"$CODEX_HOME/secrets\" \"$HOME/.ssh\" && printf 'dummy-vault-probe\\n' > \"$CODEX_HOME/secrets/probe.txt\" && printf 'Host demo-synthetic\\n' > \"$HOME/.ssh/config\" && echo 'synthetic ~/.ssh/config and vault-folder file created'"
[[steps]]
type = "Run exactly this shell command and show me its output: cat ~/.ssh/config"
[[steps]]
key = "Enter"
[[steps]]
wait = "(?s)Security level Moderate\\s+blocked\\s+access(?:(?!Working).)*\\n› "
timeout = 240
compress = 3
[[steps]]
pause = 3.0
[[steps]]
type = "Run exactly this shell command and show me its output: cat ../home/secrets/probe.txt"
[[steps]]
key = "Enter"
[[steps]]
wait = "approving cannot unlock it"
timeout = 240
compress = 2
[[steps]]
pause = 5.0
[[steps]]
key = "Enter"
[[steps]]
wait = "(?s)approved Corbanu to run[\\s\\S]*(blocked access|Operation not permitted)(?:(?!Working).)*\\n› "
timeout = 240
compress = 3
[[steps]]
pause = 3.0
