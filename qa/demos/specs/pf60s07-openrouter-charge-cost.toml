# PF-60-S07 / #368: one real OpenRouter Kimi K3 turn, then /cost (the catalogue row is $3/$15 per 1M; OpenRouter's
# endpoints listed $0.65-$4.50 input on 2026-10-09, so the charge and the estimate differ). OpenRouter reports what it charged with
# the response (usage.cost); /cost prices the request from that charge, says so on the first screen and the
# request page, and keeps the catalogue estimate only as an unused audit line on the attempt page.
id = "pf60s07-openrouter-charge-cost"
feature = "/cost prices an OpenRouter request from the charge OpenRouter reported (#368)"
expected = "After a real OpenRouter turn, /cost reads 'Cost: $…, charged by OpenRouter'. The request page names its price basis (the charge OpenRouter reported, usage.cost); the attempt page shows the published-price estimate as not used."
model = "moonshotai/kimi-k3"
provider = "openrouter"
rows = 46
cols = 150
config = """
suppress_unstable_features_warning = true
"""

[credentials]
OPENROUTER_API_KEY = "provider/openrouter_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
type = "Reply with the single word OK."
[[steps]]
key = "Enter"
[[steps]]
wait = "(?m)^\\W*OK\\W*$"
timeout = 180
compress = 3
[[steps]]
type = "/cost"
[[steps]]
key = "Enter"
[[steps]]
wait = "Cost: \\$[0-9.]+(?: \\(rounded\\))?, charged by"
[[steps]]
pause = 4
# Up from the first line wraps to Close; seven steps up is "Request 1".
[[steps]]
key = "Up"
repeat = 7
[[steps]]
wait = "› → Request 1"
[[steps]]
pause = 1.5
[[steps]]
key = "Enter"
[[steps]]
wait = "Price basis: the charge OpenRouter reported"
[[steps]]
pause = 4
[[steps]]
key = "Up"
repeat = 4
[[steps]]
wait = "› → Technical details"
[[steps]]
pause = 1
[[steps]]
key = "Enter"
[[steps]]
wait = "Attempt, components and original price"
[[steps]]
key = "Down"
repeat = 36
[[steps]]
wait = "Published-price estimate \\(not used"
[[steps]]
pause = 4
