# #660 follow-up (Travis, 2026-10-13): after kill switch-off, a Codex pane with a waiting task gets the same "Nothing restarted" notice as Claude panes.
id = "issue660-codex-switch-off-notice"
feature = "#660 follow-up: switch-off names Codex panes whose task waits"
expected = "A task for the Codex Troll sent while the kill switch is on waits. Turning the switch off starts nothing, and the notice says so: \"Nothing restarted. A task waits for each of these panes ...: `Burzum [troll]`\"."
model = "glm-5.3-flash"
provider = "zai"
config = """
suppress_unstable_features_warning = true
[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
[agents]
provider_allowlist = ["zai"]
"""
cols = 150
rows = 44

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0

# Aggressive (the kill switch is in its grants view).
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Switch to Aggressive\\?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
[[steps]]
key = "Escape"

# Crew: Nazgul and Troll Burzum (GLM 5.3 Flash).
[[steps]]
type = "/spawn"
[[steps]]
key = "Enter"
[[steps]]
wait = "Quick start"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Create Nazgul pane"
[[steps]]
key = "Enter"
[[steps]]
wait = "Select Model and Effort"
[[steps]]
key = "Enter"
[[steps]]
wait = "Select Reasoning"
[[steps]]
key = "Up"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "bound it as the Nazgul root"
[[steps]]
type = "/spawn"
[[steps]]
key = "Enter"
[[steps]]
wait = "Quick start"
[[steps]]
key = "Down"
repeat = 3
[[steps]]
key = "Enter"
[[steps]]
wait = "Choose the harness"
[[steps]]
key = "Enter"
[[steps]]
wait = "Select Model and Effort"
[[steps]]
key = "Enter"
[[steps]]
wait = "Select Reasoning"
[[steps]]
key = "Up"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Spawned Corbanu Terminal Troll pane"

# Kill switch on.
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Security level"
[[steps]]
key = "g"
[[steps]]
wait = "Grants and kill switch"
[[steps]]
key = "Down"
[[steps]]
key = "Enter"
[[steps]]
wait = "Turn the kill switch on\\?"
[[steps]]
pause = 2.0
[[steps]]
key = "Enter"
[[steps]]
wait = "Kill switch on"
[[steps]]
key = "Escape"
[[steps]]
wait = "esc back to the levels"
[[steps]]
key = "Escape"
[[steps]]
wait = "Security level"
[[steps]]
key = "Escape"

# A task for the Troll while the switch is on.
[[steps]]
type = "/spawn status"
[[steps]]
key = "Enter"
[[steps]]
wait = "Spawn Status"
[[steps]]
type = "send task to burzum"
[[steps]]
key = "Enter"
[[steps]]
wait = "Send Task to"
[[steps]]
type = "Create a file named codex-task.txt in the workspace containing the single line pf660-codex-task."
[[steps]]
key = "Enter"
[[steps]]
wait = "A task for Burzum \\[troll\\] waits"
[[steps]]
pause = 2.5

# Kill switch off: nothing restarts.
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Security level"
[[steps]]
key = "g"
[[steps]]
wait = "Grants and kill switch"
[[steps]]
key = "Down"
[[steps]]
key = "Enter"
[[steps]]
wait = "Turn the kill switch off\\?"
[[steps]]
pause = 2.5
[[steps]]
key = "Down"
[[steps]]
key = "Enter"
[[steps]]
wait = "Kill switch off"
[[steps]]
key = "Escape"
[[steps]]
wait = "esc back to the levels"
[[steps]]
key = "Escape"
[[steps]]
wait = "Security level"
[[steps]]
key = "Escape"
[[steps]]
wait = "(?s)Nothing restarted\\. A task waits for each of these panes.*Burzum"
[[steps]]
pause = 2.0
[[steps]]
run = "sleep 10; test ! -e {workspace}/codex-task.txt"
timeout = 30
[[steps]]
type = "/spawn status"
[[steps]]
key = "Enter"
[[steps]]
wait = "Burzum \\[troll\\]\\s+idle"
[[steps]]
pause = 3.0
