# Startup scrubs credentials that older builds left in the logs database and
# codex-tui.log (#179, #196). The first `!` command plants an old build's
# lines (and clears the one-time markers, as on an upgrade); after a restart
# they are masked in the file and REDACTED in the database. Record with
#   PF24_CANDIDATE=<corbanu> --bin qa/security-levels/sprints/PF-24-S03/demos/wrappers/restart-once.sh
id = "log-scrub-old-secrets"
feature = "Old secrets are scrubbed from the logs on startup"
expected = "Fake credentials planted in codex-tui.log and the logs database are masked (*****) and REDACTED after a restart, and 0 copies remain in either file."
model = "glm-5.2"
provider = "zai"
config = """
suppress_unstable_features_warning = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0

[[steps]]
type = "!printf 'old build: GET https://x.test/v1?key=fake-old-0001\\n' >> ../logs/codex-tui.log; rm ../logs/.codex-tui.log.scrub-v1; sqlite3 ../home/pfterminal_logs_2.sqlite \"INSERT INTO logs (ts, ts_nanos, level, target, feedback_log_body) VALUES (strftime('%s','now'), 0, 'DEBUG', 'old', 'old build: GET https://x.test/v1?key=fake-old-0002'); PRAGMA user_version = 0;\"; grep -c 'fake-ol[d]' ../logs/codex-tui.log ../home/pfterminal_logs_2.sqlite"
[[steps]]
key = "Enter"
[[steps]]
wait = "codex-tui\\.log:[1-9]"
[[steps]]
pause = 2.0

[[steps]]
type = "/exit"
[[steps]]
key = "Enter"
[[steps]]
wait = "restarting Corbanu Terminal.*model: +glm-5\\.2"
timeout = 60
[[steps]]
pause = 1.0

[[steps]]
type = "!sleep 2; grep '^old build' ../logs/codex-tui.log; sqlite3 ../home/pfterminal_logs_2.sqlite \"SELECT feedback_log_body FROM logs WHERE target = 'old'; PRAGMA user_version;\"; grep -c 'fake-ol[d]' ../logs/codex-tui.log ../home/pfterminal_logs_2.sqlite* | awk -F: '{n+=$NF} END {print \"copies left:\", n}'"
[[steps]]
key = "Enter"
[[steps]]
wait = "copies left: 0\\b"
[[steps]]
pause = 4.0
