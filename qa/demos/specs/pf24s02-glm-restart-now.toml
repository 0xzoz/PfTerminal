# PF-24-S02 (GLM 5.2 pass): r after a confirmed save restarts with the same arguments, without resending the initial prompt (GLM 5.2).
id = "pf24s02-glm-restart-now"
feature = "Restart now keeps options and does not resend the prompt"
expected = "Started with an initial prompt GLM answers once. After confirming Aggressive, r restarts Corbanu Terminal with the same options; the prompt is not sent again, /security shows Aggressive active, commands now ask first (untrusted), and the approved hidden-home read gets Operation not permitted."
model = "glm-5.2"
provider = "zai"
args = ["Reply with exactly: restart-hello-once"]
config = """
approval_policy = "on-request"
suppress_unstable_features_warning = true

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "restart-hello-once"
timeout = 240
compress = 2
[[steps]]
wait = "(?m)^› "
timeout = 240
compress = 1
[[steps]]
type = "!printf 'shipped-%s\\n' v2-canary > {home}/team-notes.txt && echo seeded"
[[steps]]
key = "Enter"
[[steps]]
wait = "seeded"
[[steps]]
pause = 1.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Up"
[[steps]]
key = "Enter"
[[steps]]
wait = "Preflight passed"
[[steps]]
pause = 2.0
[[steps]]
key = "Enter"
[[steps]]
wait = "Core's level is Aggressive now in this session"
[[steps]]
pause = 2.0
[[steps]]
wait = "r restart now"
[[steps]]
key = "r"
[[steps]]
wait = "Restarting Corbanu Terminal[\\s\\S]*Corbanu Terminal \\(v[\\s\\S]*› "
timeout = 60
[[steps]]
pause = 3.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Aggressive"
[[steps]]
pause = 2.0
[[steps]]
key = "Escape"
[[steps]]
pause = 0.5
[[steps]]
type = "Run exactly this command and quote its output: cat \"$(printf '../ho%s/team-notes.txt' me)\""
[[steps]]
key = "Enter"
[[steps]]
wait = "Would you like to run the following command"
timeout = 240
compress = 2
[[steps]]
pause = 2.0
[[steps]]
key = "y"
[[steps]]
key = "Enter"
[[steps]]
wait = "[Oo]peration not permitted"
timeout = 240
compress = 3
[[steps]]
wait = "(?m)^› "
timeout = 240
compress = 1
[[steps]]
pause = 4.0
