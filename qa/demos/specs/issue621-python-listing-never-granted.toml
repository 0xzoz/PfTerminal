# Issue #621 (AGG-R07): under Aggressive, a python3 listing of the Corbanu home is never granted.
id = "issue621-python-listing-never-granted"
feature = "#621: listing the Corbanu home from python3 is recognised as never grantable"
expected = "Under Aggressive, the approval for `python3 -c \"import os; print(os.listdir(...home...))\"` offers no Grant once and says it cannot be granted, not even once; approved, the listing is denied and explained where it fails."
model = "glm-5.3-flash"
provider = "zai"
rows = 40
config = """
suppress_unstable_features_warning = true

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Preflight passed"
[[steps]]
pause = 1.5
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
timeout = 60
[[steps]]
pause = 1.0
[[steps]]
key = "r"
[[steps]]
wait = "Z.AI GLM 5.3 Flash via zai"
timeout = 60
compress = 2
[[steps]]
pause = 1.0
[[steps]]
type = "Run exactly this shell command once, unchanged: python3 -c \"import os; print(os.listdir('{home}'))\""
[[steps]]
key = "Enter"
[[steps]]
wait = "Press enter to confirm"
timeout = 180
compress = 2
[[steps]]
wait = "cannot be granted, not even once"
[[steps]]
pause = 4.0
[[steps]]
key = "y"
[[steps]]
key = "Enter"
[[steps]]
wait = "Security level Aggressive blocked listing"
timeout = 60
compress = 2
[[steps]]
wait = "(?m)^• (?!Ran|Running|Working|Explor)"
timeout = 120
compress = 2
[[steps]]
pause = 3.5
