# #442 (Travis's decision 2026-10-12): .env.example, .env.sample and .env.template are exempt from the
# Aggressive .env rule; .env itself stays unreadable.
id = "issue442-env-templates-usable"
feature = "#442: .env templates stay usable under Aggressive; .env stays unreadable"
expected = "With Aggressive active, the agent reads .env.example and writes .env.template, while reading .env (synthetic value) is denied."
model = "glm-5.3-flash"
provider = "zai"
cols = 120
rows = 40
config = """
suppress_unstable_features_warning = true

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[fixtures]
".env.example" = "DEMO_SETTING=\n"
".env" = "DEMO_SETTING=synthetic-442-person\n"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Up"
[[steps]]
key = "Enter"
[[steps]]
wait = "Switch to Aggressive\\?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
[[steps]]
pause = 1.0

[[steps]]
key = "r"
[[steps]]
wait = "Corbanu Terminal \\(v"
timeout = 60
[[steps]]
pause = 2.0

[[steps]]
type = "Run exactly this shell command once, unchanged, even if you expect part of it to be blocked: cat .env.example; echo example=$?; cat .env; echo env=$?; printf 'DEMO_SETTING=changeme\\n' > .env.template; echo template=$?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Would you like to run|Yes, proceed|Grant once"
timeout = 240
compress = 2
[[steps]]
pause = 1.5
[[steps]]
key = "Enter"
[[steps]]
wait = "(?s)template=0(?:(?!Working).)*\n› "
timeout = 240
compress = 3
[[steps]]
pause = 4.0
