# PF-27-S04 isolated credential broker. Needs the synthetic GitHub Enterprise fixture:
# see qa/security-levels/sprints/PF-27-S04/isolated-broker-20261006/README.md (GH_HOST,
# SSL_CERT_FILE exported; GH_ENTERPRISE_TOKEN passed with --credential ...=file:...).
id = "pf27-broker-crash-fails-closed"
feature = "Isolated credential broker: a dead broker fails closed"
expected = "The first request is authorized. After the broker process is stopped, the same command is blocked by network policy; the raw token is never added by Core."
model = "glm-5.2"
provider = "zai"
cols = 120
rows = 36
config = """
approval_policy = "never"
sandbox_mode = "workspace-write"
suppress_unstable_features_warning = true

[sandbox_workspace_write]
network_access = true

[features]
isolated_credential_broker = true

[features.network_proxy]
enabled = true
allow_local_binding = true

[features.network_proxy.domains]
"127.0.0.1.nip.io" = "allow"
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[fixtures]
"check.sh" = '''
printf 'agent env token sha256: %s\n' "$(printf %s "$GH_ENTERPRISE_TOKEN" | shasum -a 256 | cut -c1-12)"
curl -sS https://127.0.0.1.nip.io:8443/api/v3/user -H "Authorization: Bearer $GH_ENTERPRISE_TOKEN"
echo
'''

[[steps]]
wait = "Corbanu Terminal \\(v"

[[steps]]
pause = 1.0

[[steps]]
type = "Run sh check.sh once and show me its raw output, then stop."

[[steps]]
key = "Enter"

[[steps]]
wait = "\"authorized\": true"
timeout = 180
compress = 3

[[steps]]
pause = 2.0

[[steps]]
type = "!pkill -f -- --codex-run-as-credential-broker && echo broker stopped"

[[steps]]
key = "Enter"

[[steps]]
wait = "(?m)^\\s*└ broker stopped"

[[steps]]
pause = 1.5

[[steps]]
type = "Run sh check.sh again and show me its raw output, then stop."

[[steps]]
key = "Enter"

[[steps]]
wait = "Request blocked by network policy"
timeout = 180
compress = 3

[[steps]]
pause = 4.0
