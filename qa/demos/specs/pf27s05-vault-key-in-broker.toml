# PF-27-S05: a provider key stored in the vault is decrypted by the broker, not by Core.
# Run with --bin qa/security-levels/sprints/PF-27-S05/vault-seed-launch.sh and
# PF27_CANDIDATE=<corbanu binary>: the helper stores the key in the disposable
# vault first, so the key is in neither Core's environment nor its arguments.
id = "pf27s05-vault-key-in-broker"
feature = "Model-client auth in the broker: a Z.AI key stored in the encrypted vault is read inside the broker; Core never decrypts it"
expected = "The session answers. Core's environment has no ZAI_API_KEY; the vault holds the key; Core's log shows the broker holds the Z.AI credential."
model = "glm-5.2"
provider = "zai"
cols = 120
rows = 36
config = """
approval_policy = "never"
sandbox_mode = "danger-full-access"
suppress_unstable_features_warning = true

[features]
broker_model_auth = true
"""

[credentials]
PF27_VAULT_SEED = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"

[[steps]]
pause = 1.0

[[steps]]
type = '''!echo "ZAI_API_KEY in Core's launch env: $(ps -wwEp $PPID -o command= | tr ' ' '\n' | grep -c '^ZAI_API_KEY=')"; ls {home}/secrets'''

[[steps]]
key = "Enter"

[[steps]]
wait = "local.age"
timeout = 30

[[steps]]
type = "Reply with exactly one line: hello from the brokered session"

[[steps]]
key = "Enter"

[[steps]]
wait = "(?m)^. hello from the brokered session"
timeout = 240
compress = 3

[[steps]]
wait = "(?m)^› "
timeout = 240
compress = 1

[[steps]]
type = '!grep -hoE "credential broker started c[o]ntainment=[a-z]+|credential held by the credential broker \\(h[o]st=[^,]*, port=[0-9]+, path=[^,]*, header=[A-Za-z]+\\)" {logs}/*.log | sort | uniq -c'

[[steps]]
key = "Enter"

[[steps]]
wait = "header=Bearer"
timeout = 30

[[steps]]
pause = 4.0
