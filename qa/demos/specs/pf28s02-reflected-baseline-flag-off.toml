# PF-28-S02 control (flag off): a permitted host that echoes the injected credential. Export GH_HOST=httpbin.org and pass the
# synthetic token with --credential GH_ENTERPRISE_TOKEN=file:<token file> (see
# qa/security-levels/sprints/PF-28-S02/README.md). Synthetic credential only; its sha256 prefix is 946ae98e9fbe.
id = "pf28s02-reflected-baseline-flag-off"
feature = "Control: with secret_output_gate off, the echoed credential reaches the agent"
expected = "Same request with the flag off: the echoed token hashes to 946ae98e9fbe, the real synthetic token, so the agent process received the raw value."
model = "glm-5.2"
provider = "zai"
cols = 120
rows = 36
config = """
approval_policy = "never"
sandbox_mode = "workspace-write"
suppress_unstable_features_warning = true

[sandbox_workspace_write]
network_access = true

[features]
isolated_credential_broker = true
secret_output_gate = false

[features.network_proxy]
enabled = true

[features.network_proxy.domains]
"httpbin.org" = "allow"
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[fixtures]
"reflect.sh" = '''
export TMPDIR="$PWD/.tmp"; mkdir -p "$TMPDIR"
echo "agent env token sha256: $(printf %s "$GH_ENTERPRISE_TOKEN" | shasum -a 256 | cut -c1-12)"
curl -sS https://httpbin.org/anything/o/r.git/info/refs \
  -H "Authorization: Bearer $GH_ENTERPRISE_TOKEN" > echo.json
python3 - <<'PY'
import hashlib, json
auth = json.load(open("echo.json"))["headers"].get("Authorization", "")
token = auth.split(" ", 1)[-1]
print("echoed token sha256:", hashlib.sha256(token.encode()).hexdigest()[:12])
print("echoed header:", auth if "REDACTED" in auth else "<raw value, not shown>")
PY
'''

[[steps]]
wait = "Corbanu Terminal \\(v"

[[steps]]
pause = 1.0

[[steps]]
type = "Run sh reflect.sh once and show me its three output lines exactly, then stop."

[[steps]]
key = "Enter"

[[steps]]
wait = "echoed header:[\\s\\S]*echoed header:"
timeout = 240
compress = 3

[[steps]]
pause = 4.0
