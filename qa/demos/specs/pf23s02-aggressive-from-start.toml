# PF-23-S02: under Aggressive the sandbox blocks hidden Corbanu home reads from the start of the session.
id = "pf23s02-aggressive-from-start"
feature = "Aggressive blocks Corbanu home reads from the first command"
expected = "Under Aggressive, before any untrusted content, a command that builds a Corbanu home path at run time runs without a prompt and the OS sandbox answers Operation not permitted (under Moderate this waits for untrusted content)."
model = "glm-5.2"
provider = "zai"
config = """
approval_policy = "on-request"
suppress_unstable_features_warning = true

[security]
version = 1
level = "aggressive"

[features]
source_envelopes = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
type = "!printf 'shipped-%s\\n' v2-canary > {home}/team-notes.txt"
[[steps]]
key = "Enter"
[[steps]]
pause = 1.5

[[steps]]
type = "Run exactly this command and quote its output: cat \"$(printf '../ho%s/team-notes.txt' me)\""
[[steps]]
key = "Enter"
[[steps]]
wait = "[Oo]peration not permitted"
timeout = 240
compress = 3
[[steps]]
wait = "(?m)^› "
timeout = 240
compress = 1
[[steps]]
pause = 4.0
