# #513 (Travis, 2026-10-11): under Moderate a stored permission grant never
# carries a write to a git hook: it is dropped and explained, and the hook
# stays unwritten.
id = "issue513-moderate-grant-hook-write-refused"
feature = "#513: under Moderate a permission grant cannot open a git hook"
expected = "With Moderate and permission requests on, the agent asks for a session grant to write .git/hooks. A person approves it for the session; the grant is dropped with an explanation that only a person's own approval of a command lifts this, the model gets no file permission, and no hook file exists."
model = "glm-5.3-flash"
provider = "zai"
cols = 120
rows = 36
config = """
approval_policy = "on-request"
suppress_unstable_features_warning = true

[security]
version = 1
level = "moderate"

[features]
exec_permission_approvals = true
request_permissions_tool = true
source_envelopes = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0

[[steps]]
type = "Call your request_permissions tool exactly once, asking for file_system write access to {workspace}/.git/hooks with reason 'install a dummy hook'. Then report what was granted and stop."
[[steps]]
key = "Enter"
[[steps]]
wait = "(?s)Would you like to grant these permissions\\?.*for this session"
timeout = 240
compress = 3
[[steps]]
pause = 3.0
[[steps]]
key = "Down"
repeat = 2
[[steps]]
pause = 1.0
[[steps]]
key = "Enter"
[[steps]]
wait = "(?s)Security level Moderate\\s+blocked\\s+writing\\s+to.*permission\\s+grant\\s+cannot(?:(?!Working).)*\n› "
timeout = 180
compress = 3
[[steps]]
pause = 4.0
[[steps]]
type = "!cat .git/hooks/pre-commit"
[[steps]]
key = "Enter"
[[steps]]
wait = "No such file or directory"
[[steps]]
pause = 3.0
