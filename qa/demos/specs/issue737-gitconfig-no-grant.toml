# Issue #737 (AGG-T03): under Aggressive, git config --global (~/.gitconfig) is offered no Grant once and says why.
id = "issue737-gitconfig-no-grant"
feature = "#737: no Grant once for git config --global"
expected = "Under Aggressive, the approval for `git config --global core.hooksPath /tmp/t03-hooks` offers no Grant once and says ~/.gitconfig is a start-up file outside the current folder, not even once; approved, the write is denied and explained the same way."
model = "glm-5.3-flash"
provider = "zai"
cols = 140
rows = 50
config = """
suppress_unstable_features_warning = true

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Preflight passed"
[[steps]]
pause = 1.5
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
timeout = 60
[[steps]]
pause = 1.0
[[steps]]
key = "r"
[[steps]]
wait = "Z.AI GLM 5.3 Flash via zai"
timeout = 60
compress = 2
[[steps]]
pause = 1.0
[[steps]]
type = "Run exactly this shell command once, unchanged: git config --global core.hooksPath /tmp/t03-hooks"
[[steps]]
key = "Enter"
[[steps]]
wait = "Press enter to confirm"
timeout = 180
compress = 2
[[steps]]
wait = "blocks writing `~/.gitconfig`"
[[steps]]
pause = 4.0
[[steps]]
run = "tmux -L \"$(ls -t \"${TMUX_TMPDIR:-/tmp}/tmux-$(id -u)\" | grep '^demo-issue737-gitconfig-no-grant-' | head -1)\" capture-pane -p -t demo > {run}/prompt-737.txt"
[[steps]]
key = "y"
[[steps]]
key = "Enter"
[[steps]]
wait = "(?s)You approved.*⚠ Security level Aggressive blocks writing.*─{10}.*\\n• "
timeout = 120
compress = 2
[[steps]]
pause = 3.5
