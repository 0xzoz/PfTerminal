# #435 (AGG-20): /spawn Troll before any Nazgul.
id = "agg-435-first-troll"
feature = "#435: /spawn Troll works before a Nazgul exists"
expected = "Under Aggressive, /spawn, Troll, Corbanu Terminal harness, GLM 5.3 Flash, Low spawns the Troll pane (on 0.1.48: Custom crew root was not created)."
model = "glm-5.3-flash"
provider = "zai"
config = """
suppress_unstable_features_warning = true

[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0
[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Preflight passed"
[[steps]]
key = "Enter"
[[steps]]
wait = "Saved: Aggressive"
[[steps]]
pause = 1.0
[[steps]]
key = "r"
[[steps]]
wait = "Z.AI GLM 5.3 Flash via zai"
timeout = 60
compress = 2
[[steps]]
pause = 1.0
[[steps]]
type = "/spawn"
[[steps]]
key = "Enter"
[[steps]]
wait = "Create a persistent supervisor agent pane"
[[steps]]
key = "Down"
repeat = 3
[[steps]]
key = "Enter"
[[steps]]
wait = "Choose the harness for this Troll pane"
[[steps]]
key = "Enter"
[[steps]]
wait = "Select Model and Effort"
[[steps]]
key = "Enter"
[[steps]]
wait = "Select Reasoning Level"
[[steps]]
key = "Up"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Spawned Corbanu Terminal Troll pane"
timeout = 60
[[steps]]
pause = 3.0
