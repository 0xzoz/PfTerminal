# PF-84 #609: in /providers, the provider's `default` row says when its status
# is this session's named account. Record with
#   DEMO_CANDIDATE=<corbanu> python3 scripts/demo_video.py record \
#     qa/demos/specs/pf84-609-default-row-names-account.toml \
#     --bin qa/demos/wrappers/pf84-609-default-row-names-account.sh --sprint ISSUE-609 --publish
id = "pf84-609-default-row-names-account"
feature = "PF-84 #609: the default row names the account its status is about"
expected = "A session on the named Z.AI account work answers on it; /providers shows the Z.AI default row as configured with '(status of account `work`)', and the work row as this session."
model = "glm-5.3-flash"
provider = "zai"
cols = 130
rows = 40
config = """
suppress_unstable_features_warning = true
[features]
named_accounts = true
"""

[credentials]
PF84_ACCOUNT_SEED = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0
[[steps]]
type = "Reply with the single word ping"
[[steps]]
key = "Enter"
[[steps]]
wait = "(?m)^\\W*ping\\W*$"
timeout = 120
compress = 3
[[steps]]
type = "/providers"
[[steps]]
key = "Enter"
[[steps]]
wait = "status of account `work`"
[[steps]]
pause = 4.0
