# PF-29-S02.
id = "pf29s02-migrate-and-save"
feature = "Confirmed migration moves the value into the vault, re-audits and saves Aggressive"
expected = "Enter moves the value into the real (disposable) vault, the profile line becomes a vault reference with 0600 access, the re-audit passes and Aggressive saves; the value is never shown."
model = "glm-5.2"
provider = "zai"
config = """
suppress_unstable_features_warning = true
[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[fixtures]
"seed.sh" = '''
printf "alias ll='ls -l'\nexport OPENAI_API_KEY=fake-key-0001-pf29-demo\n" > "$HOME/.zshrc" && echo seeded fake profile export
'''
"check.sh" = '''
printf 'plain-text values left: '; grep -c 'fake-key-0001' "$HOME/.zshrc"; ls -l "$HOME/.zshrc" | cut -c1-10; grep OPENAI "$HOME/.zshrc"
'''

[[steps]]
wait = "Corbanu Terminal \\(v"

[[steps]]
type = "!sh seed.sh"

[[steps]]
key = "Enter"

[[steps]]
wait = "seeded fake profile export"

[[steps]]
type = "/security"

[[steps]]
key = "Enter"

[[steps]]
wait = "Active in this session: Permissive"

[[steps]]
key = "Up"

[[steps]]
key = "Enter"

[[steps]]
wait = "Switch to Aggressive\\?"

[[steps]]
key = "Down"
repeat = 20

[[steps]]
wait = "m move credentials to the vault"

[[steps]]
key = "m"

[[steps]]
wait = "Move 1 credential into the vault"

[[steps]]
pause = 1.5

[[steps]]
key = "Enter"

[[steps]]
wait = "Moved 1 credential into the vault"

[[steps]]
wait = "Rotate at the provider: OPENAI_API_KEY"

[[steps]]
pause = 3.0

[[steps]]
key = "Enter"

[[steps]]
wait = "Preflight passed"

[[steps]]
pause = 2.5

[[steps]]
key = "Enter"

[[steps]]
wait = "Saved: Aggressive"

[[steps]]
pause = 1.0

[[steps]]
key = "Enter"

[[steps]]
type = "!sh check.sh"

[[steps]]
key = "Enter"

[[steps]]
wait = "plain-text values left: 0[\\s\\S]*-rw-------[\\s\\S]*auth-helper migrated/openai_api_key"

[[steps]]
pause = 4.0
