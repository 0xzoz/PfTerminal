# #514: in the app-link view a server's link request opens (URL-mode MCP
# elicitation), a number key only highlights its action; Enter confirms it
# (as the approval prompts since #187/#192).
id = "issue514-app-link-number-key-highlights"
feature = "#514: a number key does not answer a server's link request"
expected = "A test MCP server asks to open a sign-in link. Pressing 2 only highlights Back and the request stays open; typed text is not sent and Enter is ignored. After the arrow keys, 2 and Enter decline it, and the tool reports the decline."
model = "glm-5.3-flash"
provider = "zai"
cols = 120
rows = 36
config = """
suppress_unstable_features_warning = true

[features]
code_mode = true

[mcp_servers.linkdemo]
command = "python3"
args = ["{workspace}/linkdemo_server.py"]
default_tools_approval_mode = "approve"
"""

[fixtures]
"linkdemo_server.py" = '''
#!/usr/bin/env python3
"""Tiny stdio MCP server for the #514 tmux check: its one tool asks the
client to open a link (URL-mode elicitation) and reports the answer."""
import json
import sys


def send(message):
    sys.stdout.write(json.dumps(message) + "\n")
    sys.stdout.flush()


def read():
    line = sys.stdin.readline()
    if not line:
        sys.exit(0)
    return json.loads(line)


pending_call = None
while True:
    message = read()
    method = message.get("method")
    if method == "initialize":
        send({
            "jsonrpc": "2.0",
            "id": message["id"],
            "result": {
                "protocolVersion": message["params"].get("protocolVersion", "2025-06-18"),
                "capabilities": {"tools": {}},
                "serverInfo": {"name": "linkdemo", "version": "0.1.0"},
            },
        })
    elif method == "tools/list":
        send({
            "jsonrpc": "2.0",
            "id": message["id"],
            "result": {"tools": [{
                "name": "connect_account",
                "description": "Ask the user to open a sign-in link, then report what they chose.",
                "inputSchema": {"type": "object", "properties": {}},
            }]},
        })
    elif method == "tools/call":
        pending_call = message["id"]
        send({
            "jsonrpc": "2.0",
            "id": "elicit-514",
            "method": "elicitation/create",
            "params": {
                "mode": "url",
                "message": "Sign in to the demo service to continue.",
                "url": "https://example.com/issue514-sign-in",
                "elicitationId": "issue514",
            },
        })
    elif message.get("id") == "elicit-514" and pending_call is not None:
        action = (message.get("result") or {}).get("action", "error")
        send({
            "jsonrpc": "2.0",
            "id": pending_call,
            "result": {"content": [{"type": "text", "text": f"link request answered: {action}"}]},
        })
        pending_call = None
    elif "id" in message and method is not None:
        send({"jsonrpc": "2.0", "id": message["id"], "result": {}})
'''

