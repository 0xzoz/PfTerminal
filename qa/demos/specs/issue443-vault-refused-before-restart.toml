# Issue #443 (milestone AGG-04/AGG-37): confirming Aggressive protects this session at once.
id = "issue443-vault-refused-before-restart"
feature = "Aggressive's vault refusal holds as soon as you confirm, before any restart"
expected = "Screen 07 says what is active now and what starts at the restart; without restarting, the agent's `corbanu vault list` is refused by the Aggressive vault rule."
model = "glm-5.3-flash"
provider = "zai"
config = """
suppress_unstable_features_warning = true
[features]
security_levels = true
protected_mode_preflight = true
secretless_agent_launch = true
isolated_credential_broker = true
secret_output_gate = true
source_envelopes = true
url_destination_policy = true
contained_external_agents = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0

[[steps]]
type = "/security"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active in this session: Permissive"
[[steps]]
key = "Down"
repeat = 2
[[steps]]
key = "Enter"
[[steps]]
wait = "Switch to Aggressive\\?"
[[steps]]
key = "Enter"
[[steps]]
wait = "Active now in this session"
[[steps]]
pause = 5.0
[[steps]]
key = "Escape"

[[steps]]
type = "Without reading anything first, run exactly this shell command once and show its output: corbanu vault list"
[[steps]]
key = "Enter"
[[steps]]
wait = "Security level Aggressive: agents cannot use"
timeout = 180
compress = 3
[[steps]]
wait = "(?m)^› "
timeout = 120
compress = 2
[[steps]]
pause = 3.5
