# PF-33-S01: credentials are stripped on cross-origin redirect hops (synthetic canary only).
id = "pf33s01-credentials-same-origin"
feature = "URL destination policy: Authorization does not follow a redirect to another origin"
expected = "Flag on: even with curl --location-trusted, postman-echo.com receives no authorization header after the cross-origin redirect."
model = "glm-5.2"
provider = "zai"
cols = 120
rows = 36
config = """
approval_policy = "never"
sandbox_mode = "workspace-write"
suppress_unstable_features_warning = true

[sandbox_workspace_write]
network_access = true

[features]
url_destination_policy = true

[features.network_proxy]
enabled = true
allow_local_binding = true

[features.network_proxy.domains]
"httpbin.org" = "allow"
"postman-echo.com" = "allow"
"localtest.me" = "allow"
"*.nip.io" = "allow"
"169.254.169.254" = "allow"
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[fixtures]
"creds.sh" = '''echo "Sends Authorization: Bearer fake-key-0001 (synthetic) and follows the redirect with it."
echo "httpbin.org redirects to postman-echo.com, which echoes the headers it received:"
curl -sS --location-trusted -H 'Authorization: Bearer fake-key-0001' \
  'https://httpbin.org/redirect-to?url=https://postman-echo.com/headers'
echo
'''

[[steps]]
wait = "Corbanu Terminal \\(v"
[[steps]]
pause = 1.0

[[steps]]
type = "Run sh creds.sh with your shell tool and show me its full output verbatim in a code block. Do not run anything else."
[[steps]]
key = "Enter"
[[steps]]
wait = 'postman-echo.com.*(user-agent|accept)'
timeout = 300
compress = 3
[[steps]]
wait = "(?m)^› "
timeout = 240
compress = 1

[[steps]]
pause = 4.0
