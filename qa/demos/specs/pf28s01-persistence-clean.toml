# PF-28-S01 secret output gate. Pass the synthetic canary with
# --credential PF28_CANARY_API_KEY=file:<canary file>.
id = "pf28s01-persistence-clean"
feature = "Secret output gate: transcripts, logs and history never store a managed secret"
expected = "After the agent prints the canary, no file in the profile or log directory holds it; the transcript holds only the redaction marker."
model = "glm-5.2"
provider = "zai"
cols = 120
rows = 36
config = """
approval_policy = "never"
sandbox_mode = "workspace-write"
suppress_unstable_features_warning = true

[features]
secret_output_gate = true
"""

[credentials]
ZAI_API_KEY = "provider/zai_api_key"

[fixtures]
"show.sh" = '''
echo "canary: $PF28_CANARY_API_KEY"
'''
"count.sh" = '''
files=$(grep -rlF "$PF28_CANARY_API_KEY" ../home ../logs 2>/dev/null | wc -l | tr -d ' ')
markers=$(grep -rhoF 'REDACTED:env:PF28_CANARY_API_KEY' ../home/sessions 2>/dev/null | wc -l | tr -d ' ')
echo "files holding the canary: $files; markers in the transcript: $markers"
'''

[[steps]]
wait = "Corbanu Terminal \\(v"

[[steps]]
pause = 1.0

[[steps]]
type = "Run sh show.sh and then stop."

[[steps]]
key = "Enter"

[[steps]]
wait = "canary: \\[REDACTED"
timeout = 180
compress = 3

[[steps]]
wait = "›"
timeout = 120
compress = 2

[[steps]]
pause = 2.0

[[steps]]
type = "!sh count.sh"

[[steps]]
key = "Enter"

[[steps]]
wait = "files holding the canary: \\d+; markers in the transcript: [1-9]"

[[steps]]
pause = 4.0
