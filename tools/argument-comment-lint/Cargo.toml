[package]
name = "argument_comment_lint"
version = "0.1.0"
description = "Dylint lints for Rust /*param*/ argument comments"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
bazel_native = []

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "80d61c55dcea720ace345ee0264d27e547d0a7b0" }
# Keep dylint_* in step with CARGO_DYLINT_VERSION in the workflows.
dylint_linting = "=6.1.1"

[dev-dependencies]
dylint_testing = "=6.1.1"

[workspace]

[package.metadata.rust-analyzer]
rustc_private = true
