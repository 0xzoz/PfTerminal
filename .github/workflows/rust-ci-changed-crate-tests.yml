name: rust-ci changed crate tests

# The tests (unit and integration) of the codex-rs crates a PR changes, on
# Linux (#1972). Before this, the full Linux suite ran only postmerge
# (rust-ci-full.yml) and the Linux Bazel tests only nightly, so a PR that broke
# its own crate's tests (#1963 broke two codex-rmcp-client tests) went green.
# `.github/scripts/changed_crate_test_packages.py` picks the crates (any file
# under the crate; not the crates depending on it, which postmerge covers)
# and leaves out the slowest suites: codex-core, codex-app-server and
# codex-tui. Restore-only: it reuses main's Linux core-security sccache (same
# target and dev profile) and saves nothing (#636).
on:
  workflow_call:
    inputs:
      packages:
        description: Space-separated package names.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated package names.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: cargo nextest (changed crates)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: codex-rs
    env:
      # sccache cannot cache incremental compilations.
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 2G
      # Tests must never reach the runner's OS keyring.
      CORBANU_TEST_NO_NATIVE_KEYRING: "1"
      RUST_BACKTRACE: "1"
      RUST_MIN_STACK: "8388608" # 8 MiB
      NEXTEST_STATUS_LEVEL: leak
      PACKAGES: ${{ inputs.packages }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      # bubblewrap: sandboxed commands in tests, as in rust-ci-full's nextest job.
      - name: Install Linux build dependencies
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev bubblewrap
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ env.TARGET }}
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache
          version: 0.7.5
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103
      - name: Configure sccache
        id: sccache_config
        run: |
          set -euo pipefail
          {
            echo "SCCACHE_DIR=${CI_BUILD_ROOT}/sccache"
            echo "RUSTC_WRAPPER=$(command -v sccache)"
          } >> "$GITHUB_ENV"
          echo "lockhash=$(cat Cargo.lock rust-toolchain.toml | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # rust-ci-core-security.yml's Linux cache, saved on main.
      - name: Restore sccache cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-core-security-ubuntu-24.04-${{ env.TARGET }}-${{ steps.sccache_config.outputs.lockhash }}-${{ github.run_id }}
          restore-keys: |
            sccache-core-security-ubuntu-24.04-${{ env.TARGET }}-${{ steps.sccache_config.outputs.lockhash }}-
            sccache-core-security-ubuntu-24.04-${{ env.TARGET }}-

      # Binaries from other crates that these tests start (found next to the
      # test binaries by `cargo_bin`).
      - name: Build the test helpers
        run: |
          set -euo pipefail
          read -r -a helpers <<< "$(python3 ../.github/scripts/changed_crate_test_packages.py --helpers $PACKAGES)"
          if (( ${#helpers[@]} == 0 )); then
            echo "No helpers needed."
            exit 0
          fi
          cargo build --locked --target "$TARGET" "${helpers[@]}"

      - name: cargo nextest run
        run: |
          set -euo pipefail
          args=()
          for package in $PACKAGES; do
            args+=(-p "$package")
          done
          echo "Packages: $PACKAGES"
          cargo nextest run --locked --target "$TARGET" "${args[@]}" --no-fail-fast --no-tests=pass

      - name: sccache stats
        if: always()
        continue-on-error: true
        run: sccache --show-stats || true

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
