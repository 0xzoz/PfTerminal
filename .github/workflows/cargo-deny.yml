name: cargo-deny

on:
  workflow_call:

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./codex-rs
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

      # EmbarkStudios/cargo-deny-action is a Docker action whose image pulls
      # rust:1.85.0-alpine3.20 from Docker Hub anonymously, which hits the
      # unauthenticated pull rate limit on shared runners. Install the same
      # cargo-deny release it ships, checksum-verified, and run it directly.
      - name: Install cargo-deny
        shell: bash
        env:
          CARGO_DENY_VERSION: 0.19.0
          CARGO_DENY_SHA256: 0e8c2aa59128612c90d9e09c02204e912f29a5b8d9a64671b94608cbe09e064f
        run: |
          set -euo pipefail
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          install_dir="${RUNNER_TEMP}/cargo-deny"
          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}"
          echo "${CARGO_DENY_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${install_dir}" --strip-components=1
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Run cargo-deny
        # Same arguments as the action's defaults (log-level warn,
        # --all-features, check). Runs in ./codex-rs, so rust-toolchain.toml
        # selects 1.99.1 as the action's rust-version input did.
        env:
          CARGO_TERM_COLOR: always
        run: cargo-deny --log-level warn --manifest-path ./Cargo.toml --all-features check

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
