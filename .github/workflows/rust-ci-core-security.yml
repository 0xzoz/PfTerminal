name: rust-ci core security tests

# codex-core's security unit tests (`security::`: protected paths, read
# denials, taint, approvals) on one runner. Shared by rust-ci.yml (PR: Linux
# and macOS) and rust-ci-full.yml (postmerge: macOS; Linux runs the whole
# suite there). Before this, no job ran codex-core tests on macOS, so a
# macOS-only security failure (#512: a denial spelled through the `/tmp` or
# `/var` link) stayed red on main unnoticed.
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (ubuntu-24.04 or macos-15).
        required: true
        type: string
      target:
        description: Rust target triple for that runner.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: "cargo test codex-core security::"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    env:
      # sccache cannot cache incremental compilations.
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 10G
      # Tests must never reach the runner's OS keyring.
      CORBANU_TEST_NO_NATIVE_KEYRING: "1"
      RUST_BACKTRACE: "1"
      RUST_MIN_STACK: "8388608" # 8 MiB
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
      - name: Enable unprivileged user namespaces (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ inputs.target }}
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache
          version: 0.7.5
      # Local-disk sccache persisted with actions/cache, as in
      # rust-ci-lint-build.yml's fallback.
      - name: Configure sccache
        id: sccache_config
        run: |
          set -euo pipefail
          {
            echo "SCCACHE_DIR=${CI_BUILD_ROOT}/sccache"
            echo "RUSTC_WRAPPER=$(command -v sccache)"
          } >> "$GITHUB_ENV"
          echo "lockhash=$(shasum -a 256 Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore sccache cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-core-security-${{ inputs.runner }}-${{ inputs.target }}-${{ steps.sccache_config.outputs.lockhash }}-${{ github.run_id }}
          restore-keys: |
            sccache-core-security-${{ inputs.runner }}-${{ inputs.target }}-${{ steps.sccache_config.outputs.lockhash }}-
            sccache-core-security-${{ inputs.runner }}-${{ inputs.target }}-

      - name: Build the codex-core test binary
        run: cargo test --locked --target ${{ inputs.target }} -p codex-core --lib --no-run

      # The runner's own TMPDIR (on macOS a folder under the `/var` link).
      - name: "cargo test codex-core security::"
        run: |
          cargo test --locked --target ${{ inputs.target }} -p codex-core --lib -- security::

      # Temporary folders under `/tmp` (on macOS a link to `/private/tmp`).
      - name: "cargo test codex-core security:: (TMPDIR=/tmp)"
        env:
          TMPDIR: /tmp
        run: |
          cargo test --locked --target ${{ inputs.target }} -p codex-core --lib -- security::

      - name: Save sccache cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-core-security-${{ inputs.runner }}-${{ inputs.target }}-${{ steps.sccache_config.outputs.lockhash }}-${{ github.run_id }}

      - name: sccache stats
        if: always()
        continue-on-error: true
        run: sccache --show-stats || true

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
