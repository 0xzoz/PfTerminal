name: cache-prune

# main's build caches (sccache, ...) are keyed by run ID, so each main run saves
# a fresh multi-GB copy and the copies fill the 10 GB Actions cache limit
# (#636). After each workflow that saves them finishes on main, keep only the
# newest copy of each cache family. The `actions: write` token lives only in
# this job, which runs main's own script and builds nothing.
on:
  workflow_run:
    workflows: [blocking-ci, postmerge-ci, nightly-ci, tmux smoke, CodeQL]
    types: [completed]
    branches: [main]
  # Long postmerge runs save caches well before they complete.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cache-prune
  cancel-in-progress: false

jobs:
  prune:
    name: Prune older main cache copies
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Delete all but the newest copy of each run-scoped cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prune_actions_caches.py --repo "${{ github.repository }}"
