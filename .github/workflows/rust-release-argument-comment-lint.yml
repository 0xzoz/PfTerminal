name: rust-release-argument-comment-lint

# Builds the prebuilt argument-comment-lint packages that
# `tools/argument-comment-lint/argument-comment-lint` (DotSlash) points at.
#
# Corbanu publishes them by dispatching this workflow with `publish: true`. That
# creates a prerelease (never "latest") tagged
# `argument-comment-lint-<lint nightly>-<short sha>` with the four archives and
# a generated DotSlash file. Copy that file over the checked-in one. CI builds
# the lint from source and does not use these packages (#1130).
on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a prerelease with the packages; otherwise only build them as workflow artifacts."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Cargo's libgit2 transport has been flaky when fetching git dependencies with
# nested submodules. Prefer the system git CLI across every Cargo invocation.
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  skip:
    if: ${{ !inputs.publish && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipping argument-comment-lint release assets for prerelease tag"

  build:
    if: ${{ inputs.publish || github.event_name == 'workflow_dispatch' }}
    name: Build - ${{ matrix.runner }} - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_DYLINT_VERSION: 6.1.1
      DYLINT_LINK_VERSION: 6.1.1

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            archive_name: argument-comment-lint-aarch64-apple-darwin.tar.gz
            lib_name: libargument_comment_lint@nightly-2026-08-08-aarch64-apple-darwin.dylib
            runner_binary: argument-comment-lint
            cargo_dylint_binary: cargo-dylint
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_name: argument-comment-lint-x86_64-unknown-linux-gnu.tar.gz
            lib_name: libargument_comment_lint@nightly-2026-08-08-x86_64-unknown-linux-gnu.so
            runner_binary: argument-comment-lint
            cargo_dylint_binary: cargo-dylint
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_name: argument-comment-lint-aarch64-unknown-linux-gnu.tar.gz
            lib_name: libargument_comment_lint@nightly-2026-08-08-aarch64-unknown-linux-gnu.so
            runner_binary: argument-comment-lint
            cargo_dylint_binary: cargo-dylint
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            archive_name: argument-comment-lint-x86_64-pc-windows-msvc.zip
            lib_name: argument_comment_lint@nightly-2026-08-08-x86_64-pc-windows-msvc.dll
            runner_binary: argument-comment-lint.exe
            cargo_dylint_binary: cargo-dylint.exe

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: nightly-2026-08-08
          targets: ${{ matrix.target }}
          components: llvm-tools-preview, rustc-dev, rust-src

      - name: Install tooling
        shell: bash
        run: |
          install_root="${RUNNER_TEMP}/argument-comment-lint-tools"
          cargo install --locked cargo-dylint --version "$CARGO_DYLINT_VERSION" --root "$install_root"
          cargo install --locked dylint-link --version "$DYLINT_LINK_VERSION"
          echo "INSTALL_ROOT=$install_root" >> "$GITHUB_ENV"

      - name: Cargo build
        working-directory: tools/argument-comment-lint
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          dest="dist/argument-comment-lint/${{ matrix.target }}"
          mkdir -p "$dest"
          package_root="${RUNNER_TEMP}/argument-comment-lint"
          rm -rf "$package_root"
          mkdir -p "$package_root/bin" "$package_root/lib"

          cp "tools/argument-comment-lint/target/${{ matrix.target }}/release/${{ matrix.runner_binary }}" \
            "$package_root/bin/${{ matrix.runner_binary }}"
          cp "${INSTALL_ROOT}/bin/${{ matrix.cargo_dylint_binary }}" \
            "$package_root/bin/${{ matrix.cargo_dylint_binary }}"
          cp "tools/argument-comment-lint/target/${{ matrix.target }}/release/${{ matrix.lib_name }}" \
            "$package_root/lib/${{ matrix.lib_name }}"

          archive_path="$dest/${{ matrix.archive_name }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            (cd "${RUNNER_TEMP}" && 7z a "$GITHUB_WORKSPACE/$archive_path" argument-comment-lint >/dev/null)
          else
            (cd "${RUNNER_TEMP}" && tar -czf "$GITHUB_WORKSPACE/$archive_path" argument-comment-lint)
          fi

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: argument-comment-lint-${{ matrix.target }}
          path: dist/argument-comment-lint/${{ matrix.target }}/*

  publish-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    name: Publish prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: argument-comment-lint-*
          merge-multiple: true

      - name: Create prerelease
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nightly="$(sed -n 's/^channel = "\(nightly-[0-9-]*\)"$/\1/p' tools/argument-comment-lint/rust-toolchain)"
          [[ -n "$nightly" ]] || { echo "no nightly channel in tools/argument-comment-lint/rust-toolchain"; exit 1; }
          tag="argument-comment-lint-${nightly}-${GITHUB_SHA::10}"

          shopt -s nullglob
          archives=(dist/argument-comment-lint-*.tar.gz dist/argument-comment-lint-*.zip)
          ls -l "${archives[@]}"
          [[ "${#archives[@]}" -eq 4 ]] || { echo "expected 4 archives, found ${#archives[@]}"; exit 1; }

          # DotSlash files pin these assets by digest, so never replace them.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists; refusing to overwrite its assets"
            exit 1
          fi

          gh release create "$tag" "${archives[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "argument-comment-lint (${nightly}, ${GITHUB_SHA::10})" \
            --notes "Prebuilt argument-comment-lint packages for ${nightly}, built from ${GITHUB_SHA} by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Used by tools/argument-comment-lint/argument-comment-lint (DotSlash); not a Corbanu Terminal release."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: facebook/dotslash-publish-release@9c9ec027515c34db9282a09a25a9cab5880b2c52 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ steps.release.outputs.tag }}
          config: .github/dotslash-argument-comment-lint-config.json

      - name: Summary
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "Published \`$TAG\`."
            echo "Copy its \`argument-comment-lint\` asset over \`tools/argument-comment-lint/argument-comment-lint\`."
          } >> "$GITHUB_STEP_SUMMARY"
