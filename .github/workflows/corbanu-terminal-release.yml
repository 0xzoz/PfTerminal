name: corbanu-terminal-release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version; must match codex-rs/Cargo.toml."
        required: true
        type: string
        default: "0.1.48"
      publish_release:
        description: "Create or update the matching GitHub release."
        required: true
        type: boolean
        default: false
      make_latest:
        description: "Mark the GitHub release as latest when publishing."
        required: true
        type: boolean
        default: false
      reuse_run_id:
        description: "Optional failed release run whose successful non-Windows artifacts should be reused."
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?$ ]]; then
            echo "release_version must be x.y.z, x.y.z-alpha.N, or x.y.z-beta.N"
            exit 1
          fi

          cargo_version="$(grep -m1 '^version' codex-rs/Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"
          if [[ "$RELEASE_VERSION" != "$cargo_version" ]]; then
            echo "release_version ${RELEASE_VERSION} does not match codex-rs/Cargo.toml ${cargo_version}"
            exit 1
          fi

          if [[ -n "${{ inputs.reuse_run_id }}" && ! "${{ inputs.reuse_run_id }}" =~ ^[0-9]+$ ]]; then
            echo "reuse_run_id must be a numeric GitHub Actions run id"
            exit 1
          fi

          if [[ ! -s "qa/release/${RELEASE_VERSION}/RELEASE_NOTES.md" ]]; then
            echo "Versioned release notes are required before building packages"
            exit 1
          fi

          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=rust-v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Test Unix installer release contract
        run: python3 scripts/install/test_corbanu_release_contract.py

  build-macos:
    needs: validate
    if: ${{ inputs.reuse_run_id == '' }}
    name: Build macOS package - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Intel hosted runners can take more than two hours for a cold build. Keep
    # enough headroom for archive qualification and DMG packaging after cargo
    # completes instead of cancelling an otherwise healthy release at the
    # cleanup boundary.
    timeout-minutes: 240
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "false"
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build Corbanu Terminal package binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path codex-rs/Cargo.toml \
            --target "$TARGET" \
            --release \
            --bin corbanu \
            --bin corbanu-acp \
            --bin corbanu-walletd \
            --bin codex-code-mode-host

      - name: Build wallet package client probe
        shell: bash
        run: |
          cargo build --manifest-path codex-rs/Cargo.toml --target "$TARGET" --release \
            -p codex-core -p codex-wallet-daemon --example package_client_probe

      - name: Build standalone package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${TARGET}"
          python3 scripts/build_codex_package.py \
            --target "$TARGET" \
            --variant corbanu \
            --entrypoint-bin "codex-rs/target/${TARGET}/release/corbanu" \
            --extra-bin "corbanu-debug=codex-rs/target/${TARGET}/release/corbanu" \
            --extra-bin "corbanu-acp=codex-rs/target/${TARGET}/release/corbanu-acp" \
            --extra-bin "corbanu-walletd=codex-rs/target/${TARGET}/release/corbanu-walletd" \
            --code-mode-host-bin "codex-rs/target/${TARGET}/release/codex-code-mode-host" \
            --cargo-profile release \
            --symbols-dir "dist/${TARGET}/debug-symbols" \
            --package-dir "${RUNNER_TEMP}/corbanu-terminal-package-${TARGET}" \
            --archive-output "dist/${TARGET}/corbanu-terminal-package-${TARGET}.tar.gz" \
            --force
          tar -C "dist/${TARGET}/debug-symbols" -czf \
            "dist/${TARGET}/corbanu-symbols-${TARGET}.tar.gz" .

      - name: Smoke test package archive
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/${TARGET}/corbanu-terminal-package-${TARGET}.tar.gz"
          package_dir="${RUNNER_TEMP}/smoke-${TARGET}"
          mkdir -p "$package_dir"
          tar -xzf "$archive" -C "$package_dir"
          "$package_dir/bin/corbanu" --version
          "$package_dir/bin/corbanu" telegram --help >/dev/null
          CLAUDE_CODE_OAUTH_TOKEN=corbanu-release-smoke \
            "$package_dir/bin/corbanu" internal-claude-oauth-token \
            | grep -Fx 'corbanu-release-smoke' >/dev/null
          help_output="$("$package_dir/bin/corbanu" exec --help 2>&1)"
          grep -F '~/.corbanu/config.toml' <<<"$help_output"
          grep -F '$CORBANU_HOME/config.toml' <<<"$help_output"
          ! grep -Eqi 'pfterminal|postfiat|PFTERMINAL' <<<"$help_output"
          test -x "$package_dir/bin/corbanu-acp"
          test -x "$package_dir/bin/corbanu-walletd"
          test ! -e "$package_dir/bin/pfterminal"
          test ! -e "$package_dir/bin/pfterminal-debug"
          test ! -e "$package_dir/bin/pfterminal-acp"
          test ! -e "$package_dir/bin/pfterminal-walletd"
          "$package_dir/bin/corbanu-walletd" --help >/dev/null
          python3 scripts/smoke_wallet_package.py --package-dir "$package_dir" \
            --probe "codex-rs/target/${TARGET}/release/examples/package_client_probe"
          wallet_home="${RUNNER_TEMP}/wallet-smoke-${TARGET}"
          "$package_dir/bin/corbanu-walletd" --codex-home "$wallet_home" &
          walletd_pid=$!
          trap 'kill "$walletd_pid" 2>/dev/null || true; wait "$walletd_pid" 2>/dev/null || true' EXIT
          for _ in {1..100}; do
            test -S "$wallet_home/wallet/run/walletd.sock" && break
            kill -0 "$walletd_pid" 2>/dev/null
            sleep 0.05
          done
          test -S "$wallet_home/wallet/run/walletd.sock"
          kill "$walletd_pid"
          wait "$walletd_pid" || true
          trap - EXIT
          ! find "$package_dir" -type f -o -type l | grep -E '/codex([^/-]*)(\.exe)?$'
          test -x "$package_dir/codex-path/rg"
          telegram_resources="$package_dir/codex-resources/telegram"
          test -x "$telegram_resources/setup-telegram.sh"
          bash -n "$telegram_resources/setup-telegram.sh"
          test -f "$telegram_resources/install-telegram-task.ps1"
          test -f "$telegram_resources/dist/AGENTS.md.template"
          test -f "$telegram_resources/dist/corbanu-terminal-telegram.service"
          plutil -lint "$telegram_resources/dist/org.corbanu.terminal.telegram.plist" >/dev/null

      - name: Free runner disk before DMG packaging
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          available_kb="$(df -Pk . | awk 'NR == 2 { print $4 }')"
          reserve_kb="$((60 * 1024 * 1024))"
          if (( available_kb < reserve_kb )); then
            rm -rf \
              codex-rs/target \
              "${RUNNER_TEMP}/corbanu-terminal-package-${TARGET}" \
              "${RUNNER_TEMP}/smoke-${TARGET}" \
              "${RUNNER_TEMP}/rusty_v8" \
              "${HOME}/.cargo/git" \
              "${HOME}/.cargo/registry/cache" \
              "${HOME}/.cargo/registry/src" \
              "${HOME}/Library/Caches/Homebrew" \
              "${HOME}/Library/Developer/CoreSimulator"
            sudo rm -rf \
              /Applications/Xcode*.app \
              /Library/Developer/CoreSimulator
          else
            echo "Skipping destructive cleanup: ${available_kb} KiB available exceeds ${reserve_kb} KiB reserve"
          fi
          ls -lh "dist/${TARGET}/corbanu-terminal-package-${TARGET}.tar.gz"
          df -h .

      - name: Build macOS DMG installer
        shell: bash
        run: |
          set -euo pipefail
          scripts/install/build_macos_dmg.sh \
            --archive "dist/${TARGET}/corbanu-terminal-package-${TARGET}.tar.gz" \
            --target "$TARGET" \
            --version "${{ needs.validate.outputs.version }}" \
            --output "dist/${TARGET}/CorbanuTerminal-${TARGET}.dmg"

      - name: Smoke test macOS DMG installer
        shell: bash
        run: |
          set -euo pipefail
          dmg="dist/${TARGET}/CorbanuTerminal-${TARGET}.dmg"
          hdiutil imageinfo "$dmg" >/dev/null
          mount_dir="${RUNNER_TEMP}/corbanu-terminal-dmg-${TARGET}"
          rm -rf "$mount_dir"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -quiet
          trap 'hdiutil detach "$mount_dir" -quiet || true' EXIT
          test -x "$mount_dir/install.command"
          test -x "$mount_dir/install.sh"
          test -f "$mount_dir/corbanu-terminal-package-${TARGET}.tar.gz"
          test -f "$mount_dir/corbanu-terminal-package_SHA256SUMS"
          sh "$mount_dir/install.sh" --help >/dev/null

      - name: Upload macOS package artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: corbanu-terminal-package-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/corbanu-terminal-package-${{ matrix.target }}.tar.gz
            dist/${{ matrix.target }}/CorbanuTerminal-${{ matrix.target }}.dmg
            dist/${{ matrix.target }}/corbanu-symbols-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0

  build-linux:
    needs: validate
    if: ${{ inputs.reuse_run_id == '' }}
    name: Build Linux package - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # A cold Corbanu x86 GNU build now takes about 58 minutes before archive
    # creation because the package includes primary and compatibility binaries.
    # Leave enough time for archive creation, runtime smoke tests, and upload.
    timeout-minutes: 120
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "false"
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            # Keep the portable GNU/Linux artifact compatible with glibc 2.35.
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux package prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config \
            libcap-dev

      - if: ${{ contains(matrix.target, 'linux-musl') }}
        name: Use hermetic Cargo home (musl)
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - if: ${{ contains(matrix.target, 'linux-musl') }}
        name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - if: ${{ contains(matrix.target, 'linux-musl') }}
        name: Install musl build tools
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - if: ${{ contains(matrix.target, 'linux-musl') }}
        name: Disable aws-lc jitter entropy (musl)
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build Corbanu Terminal package binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path codex-rs/Cargo.toml \
            --target "$TARGET" \
            --release \
            --bin corbanu \
            --bin corbanu-acp \
            --bin corbanu-walletd \
            --bin codex-code-mode-host \
            --bin bwrap

      - name: Build wallet package client probe
        shell: bash
        run: |
          cargo build --manifest-path codex-rs/Cargo.toml --target "$TARGET" --release \
            -p codex-core -p codex-wallet-daemon --example package_client_probe

      - name: Build standalone package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${TARGET}"
          python3 scripts/build_codex_package.py \
            --target "$TARGET" \
            --variant corbanu \
            --entrypoint-bin "codex-rs/target/${TARGET}/release/corbanu" \
            --extra-bin "corbanu-debug=codex-rs/target/${TARGET}/release/corbanu" \
            --extra-bin "corbanu-acp=codex-rs/target/${TARGET}/release/corbanu-acp" \
            --extra-bin "corbanu-walletd=codex-rs/target/${TARGET}/release/corbanu-walletd" \
            --code-mode-host-bin "codex-rs/target/${TARGET}/release/codex-code-mode-host" \
            --bwrap-bin "codex-rs/target/${TARGET}/release/bwrap" \
            --cargo-profile release \
            --symbols-dir "dist/${TARGET}/debug-symbols" \
            --package-dir "${RUNNER_TEMP}/corbanu-terminal-package-${TARGET}" \
            --archive-output "dist/${TARGET}/corbanu-terminal-package-${TARGET}.tar.gz" \
            --force
          tar -C "dist/${TARGET}/debug-symbols" -czf \
            "dist/${TARGET}/corbanu-symbols-${TARGET}.tar.gz" .

      - name: Smoke test package archive
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/${TARGET}/corbanu-terminal-package-${TARGET}.tar.gz"
          package_dir="${RUNNER_TEMP}/smoke-${TARGET}"
          mkdir -p "$package_dir"
          tar -xzf "$archive" -C "$package_dir"
          "$package_dir/bin/corbanu" --version
          "$package_dir/bin/corbanu" telegram --help >/dev/null
          CLAUDE_CODE_OAUTH_TOKEN=corbanu-release-smoke \
            "$package_dir/bin/corbanu" internal-claude-oauth-token \
            | grep -Fx 'corbanu-release-smoke' >/dev/null
          help_output="$("$package_dir/bin/corbanu" exec --help 2>&1)"
          grep -F '~/.corbanu/config.toml' <<<"$help_output"
          grep -F '$CORBANU_HOME/config.toml' <<<"$help_output"
          ! grep -Eqi 'pfterminal|postfiat|PFTERMINAL' <<<"$help_output"
          test -x "$package_dir/bin/corbanu-acp"
          test -x "$package_dir/bin/corbanu-walletd"
          test ! -e "$package_dir/bin/pfterminal"
          test ! -e "$package_dir/bin/pfterminal-debug"
          test ! -e "$package_dir/bin/pfterminal-acp"
          test ! -e "$package_dir/bin/pfterminal-walletd"
          "$package_dir/bin/corbanu-walletd" --help >/dev/null
          python3 scripts/smoke_wallet_package.py --package-dir "$package_dir" \
            --probe "codex-rs/target/${TARGET}/release/examples/package_client_probe"
          wallet_home="${RUNNER_TEMP}/wallet-smoke-${TARGET}"
          "$package_dir/bin/corbanu-walletd" --codex-home "$wallet_home" &
          walletd_pid=$!
          trap 'kill "$walletd_pid" 2>/dev/null || true; wait "$walletd_pid" 2>/dev/null || true' EXIT
          for _ in {1..100}; do
            test -S "$wallet_home/wallet/run/walletd.sock" && break
            kill -0 "$walletd_pid" 2>/dev/null
            sleep 0.05
          done
          test -S "$wallet_home/wallet/run/walletd.sock"
          kill "$walletd_pid"
          wait "$walletd_pid" || true
          trap - EXIT
          ! find "$package_dir" -type f -o -type l | grep -E '/codex([^/-]*)(\.exe)?$'
          test -x "$package_dir/codex-path/rg"
          test -x "$package_dir/codex-resources/bwrap"
          telegram_resources="$package_dir/codex-resources/telegram"
          test -x "$telegram_resources/setup-telegram.sh"
          bash -n "$telegram_resources/setup-telegram.sh"
          test -f "$telegram_resources/install-telegram-task.ps1"
          test -f "$telegram_resources/dist/AGENTS.md.template"
          test -f "$telegram_resources/dist/corbanu-terminal-telegram.service"
          test -f "$telegram_resources/dist/org.corbanu.terminal.telegram.plist"

      - name: Upload Linux package archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: corbanu-terminal-package-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/corbanu-terminal-package-${{ matrix.target }}.tar.gz
            dist/${{ matrix.target }}/corbanu-symbols-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0

  build-windows:
    needs: validate
    name: Build Windows package - ${{ matrix.target }}
    # Keep release bytes on the same VS17 generation qualified by repository
    # CI. `windows-latest` currently resolves to a VS18 image that is not yet
    # compatible with the pinned Bazel/LLVM toolchain used by this workspace.
    runs-on: windows-2022
    # A cold release build of every packaged binary plus archive qualification
    # can exceed 150 minutes on GitHub-hosted Windows runners. Match the macOS
    # budget so qualification fails on an actual build/smoke error, not an
    # undersized runner clock.
    timeout-minutes: 240
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test Windows installer
        shell: powershell
        run: |
          & scripts/install/install_architecture.tests.ps1
          & scripts/install/install_upgrade.tests.ps1

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Configure MSVC linker
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Test native Windows provider initialization
        shell: bash
        run: |
          set -euo pipefail
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          cargo test \
            --manifest-path codex-rs/Cargo.toml \
            --target "$TARGET" \
            --release \
            -p codex-model-provider-info

      - name: Build Corbanu Terminal package binaries
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi
          cargo build \
            --manifest-path codex-rs/Cargo.toml \
            --target "$TARGET" \
            --release \
            --bin corbanu \
            --bin corbanu-acp \
            --bin corbanu-walletd \
            --bin codex-code-mode-host \
            --bin codex-command-runner \
            --bin codex-windows-sandbox-setup

      - name: Build wallet package client probe
        shell: bash
        run: |
          cargo build --manifest-path codex-rs/Cargo.toml --target "$TARGET" --release \
            -p codex-core -p codex-wallet-daemon --example package_client_probe

      - name: Build standalone package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${TARGET}"
          python scripts/build_codex_package.py \
            --target "$TARGET" \
            --variant corbanu \
            --entrypoint-bin "codex-rs/target/${TARGET}/release/corbanu.exe" \
            --extra-bin "corbanu-debug=codex-rs/target/${TARGET}/release/corbanu.exe" \
            --extra-bin "corbanu-acp=codex-rs/target/${TARGET}/release/corbanu-acp.exe" \
            --extra-bin "corbanu-walletd=codex-rs/target/${TARGET}/release/corbanu-walletd.exe" \
            --code-mode-host-bin "codex-rs/target/${TARGET}/release/codex-code-mode-host.exe" \
            --codex-command-runner-bin "codex-rs/target/${TARGET}/release/codex-command-runner.exe" \
            --codex-windows-sandbox-setup-bin "codex-rs/target/${TARGET}/release/codex-windows-sandbox-setup.exe" \
            --cargo-profile release \
            --package-dir "${RUNNER_TEMP}/corbanu-terminal-package-${TARGET}" \
            --archive-output "dist/${TARGET}/corbanu-terminal-package-${TARGET}.zip" \
            --force

      - name: Smoke test package archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "dist/${env:TARGET}/corbanu-terminal-package-${env:TARGET}.zip"
          $packageDir = Join-Path $env:RUNNER_TEMP "smoke-${env:TARGET}"
          if (Test-Path $packageDir) {
            Remove-Item -Recurse -Force $packageDir
          }
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Expand-Archive -Path $archive -DestinationPath $packageDir
          $corbanu = Join-Path $packageDir "bin/corbanu.exe"
          & $corbanu --version
          & $corbanu telegram --help | Out-Null
          $env:CLAUDE_CODE_OAUTH_TOKEN = "corbanu-release-smoke"
          try {
            $token = & $corbanu internal-claude-oauth-token
            if ($LASTEXITCODE -ne 0 -or $token -ne "corbanu-release-smoke") {
              throw "canonical Claude provider auth helper failed"
            }
          } finally {
            Remove-Item Env:CLAUDE_CODE_OAUTH_TOKEN -ErrorAction SilentlyContinue
          }
          $helpOutput = (& $corbanu exec --help 2>&1 | Out-String)
          if ($helpOutput -notmatch [regex]::Escape('~/.corbanu/config.toml')) { throw "Corbanu config path missing from help" }
          if ($helpOutput -notmatch [regex]::Escape('$CORBANU_HOME/config.toml')) { throw "CORBANU_HOME missing from help" }
          if ($helpOutput -match '(?i:pfterminal|postfiat)') { throw "legacy brand exposed in help" }
          if (-not (Test-Path (Join-Path $packageDir "bin/corbanu-acp.exe"))) { throw "missing corbanu-acp.exe" }
          $walletDaemon = Join-Path $packageDir "bin/corbanu-walletd.exe"
          if (-not (Test-Path $walletDaemon)) { throw "missing corbanu-walletd.exe" }
          foreach ($legacyName in @("pfterminal.exe", "pfterminal-debug.exe", "pfterminal-acp.exe", "pfterminal-walletd.exe")) {
            if (Test-Path (Join-Path $packageDir "bin/$legacyName")) { throw "package contains legacy command: $legacyName" }
          }
          & $walletDaemon --help | Out-Null
          python scripts/smoke_wallet_package.py --package-dir $packageDir --probe "codex-rs/target/${env:TARGET}/release/examples/package_client_probe.exe"
          if ($LASTEXITCODE -ne 0) { throw "packaged wallet client startup failed" }
          $walletHome = Join-Path $env:RUNNER_TEMP "wallet-smoke-${env:TARGET}"
          $walletProcess = Start-Process -FilePath $walletDaemon -ArgumentList @("--codex-home", $walletHome) -PassThru
          try {
            Start-Sleep -Milliseconds 500
            if ($walletProcess.HasExited) { throw "corbanu-walletd exited during startup" }
          } finally {
            if (-not $walletProcess.HasExited) { Stop-Process -Id $walletProcess.Id -Force }
          }
          $forbidden = Get-ChildItem -Path $packageDir -Recurse -File | Where-Object { $_.Name -match '^codex(?:\.exe)?$' }
          if ($forbidden) { throw "package contains forbidden codex entrypoint: $($forbidden.FullName -join ', ')" }
          if (-not (Test-Path (Join-Path $packageDir "codex-path/rg.exe"))) { throw "missing rg.exe" }
          if (-not (Test-Path (Join-Path $packageDir "codex-resources/codex-command-runner.exe"))) { throw "missing command runner" }
          if (-not (Test-Path (Join-Path $packageDir "codex-resources/codex-windows-sandbox-setup.exe"))) { throw "missing sandbox setup" }
          $telegramResources = Join-Path $packageDir "codex-resources/telegram"
          $telegramSetup = Join-Path $telegramResources "setup-telegram.sh"
          $telegramTask = Join-Path $telegramResources "install-telegram-task.ps1"
          if (-not (Test-Path $telegramSetup)) { throw "missing Telegram setup script" }
          if (-not (Test-Path $telegramTask)) { throw "missing Telegram Scheduled Task installer" }
          if (-not (Test-Path (Join-Path $telegramResources "dist/AGENTS.md.template"))) { throw "missing Telegram AGENTS template" }
          if (-not (Test-Path (Join-Path $telegramResources "dist/corbanu-terminal-telegram.service"))) { throw "missing Telegram systemd template" }
          if (-not (Test-Path (Join-Path $telegramResources "dist/org.corbanu.terminal.telegram.plist"))) { throw "missing Telegram launchd template" }
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($telegramTask, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw "invalid Telegram Scheduled Task installer: $($parseErrors -join '; ')" }

      - name: Upload Windows package archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: corbanu-terminal-package-${{ matrix.target }}
          path: dist/${{ matrix.target }}/corbanu-terminal-package-${{ matrix.target }}.zip
          if-no-files-found: error
          compression-level: 0

  assemble-release-assets:
    needs:
      - validate
      - build-macos
      - build-linux
      - build-windows
    name: Assemble release assets
    runs-on: ubuntu-latest
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        needs.build-windows.result == 'success' &&
        (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
        (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped')
      }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - if: ${{ inputs.reuse_run_id != '' }}
        name: Download qualified artifacts from recovery run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
          path: downloaded
          pattern: corbanu-terminal-package-*

      - name: Download package archives from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloaded
          pattern: corbanu-terminal-package-*

      - name: Build checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dist
          find downloaded -type f -name 'corbanu-terminal-package-*.tar.gz' -exec cp {} release-dist/ \;
          find downloaded -type f -name 'corbanu-terminal-package-*.zip' -exec cp {} release-dist/ \;
          find downloaded -type f -name 'CorbanuTerminal-*.dmg' -exec cp {} release-dist/ \;
          cp scripts/install/install.sh release-dist/install.sh
          cp scripts/install/install.ps1 release-dist/install.ps1

          find release-dist -maxdepth 1 -type f \( \
              -name 'corbanu-terminal-package-*.tar.gz' -o \
              -name 'corbanu-terminal-package-*.zip' \
            \) -print |
            sort |
            while IFS= read -r archive; do
              sha256sum "$archive" |
                awk -v name="$(basename "$archive")" '{ print $1 "  " name }'
            done > release-dist/corbanu-terminal-package_SHA256SUMS

          find release-dist -maxdepth 1 -type f -name 'CorbanuTerminal-*.dmg' -print |
            sort |
            while IFS= read -r dmg; do
              sha256sum "$dmg" |
                awk -v name="$(basename "$dmg")" '{ print $1 "  " name }'
            done > release-dist/corbanu-terminal-dmg_SHA256SUMS

          expected_count=5
          actual_count="$(find release-dist -maxdepth 1 -type f \( -name '*-package-*.tar.gz' -o -name '*-package-*.zip' \) | wc -l | tr -d ' ')"
          if [[ "$actual_count" != "$expected_count" ]]; then
            echo "Expected ${expected_count} package archives, found ${actual_count}"
            find release-dist -maxdepth 1 -type f -print
            exit 1
          fi

          expected_dmg_count=2
          actual_dmg_count="$(find release-dist -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [[ "$actual_dmg_count" != "$expected_dmg_count" ]]; then
            echo "Expected ${expected_dmg_count} macOS DMG installers, found ${actual_dmg_count}"
            find release-dist -maxdepth 1 -type f -print
            exit 1
          fi

          cat release-dist/corbanu-terminal-package_SHA256SUMS
          cat release-dist/corbanu-terminal-dmg_SHA256SUMS

      - name: Upload release asset bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: corbanu-terminal-release-assets
          path: release-dist/*
          if-no-files-found: error
          compression-level: 0

      - name: Create or update GitHub release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.validate.outputs.version }}
          body_path: qa/release/${{ needs.validate.outputs.version }}/RELEASE_NOTES.md
          files: release-dist/*
          overwrite_files: true
          make_latest: ${{ inputs.make_latest }}
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
