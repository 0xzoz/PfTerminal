[package]
name = "codex-secret-broker-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[[bin]]
name = "codex-secret-broker-service"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
codex-secret-broker = { workspace = true }
codex-vault = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
codex-protected-state = { workspace = true }
nix = { version = "0.30.1", features = ["socket", "user", "poll", "process"] }
rustix = { version = "1.1.4", features = ["process", "thread", "fs"] }

[dev-dependencies]
codex-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
