[package]
name = "codex-protected-state"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
synthetic-fixture = ["dep:tempfile", "dep:codex-linux-pidfd-spawn", "codex-linux-pidfd-spawn/synthetic-fixture"]

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
codex-linux-pidfd-spawn = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dependencies]
codex-config = { workspace = true }
codex-security-audit = { workspace = true }
codex-security-policy = { workspace = true }
codex-utils-absolute-path = { workspace = true }
hmac = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
